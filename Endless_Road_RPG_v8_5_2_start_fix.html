// ---------- Persistence ----------
const STORAGE_KEY = "endless_road_save_v1";

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

function saveGame(){
  const payload = deepClone(state);
  payload._ts = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  toast("Saved.");
}
function loadGame(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw){ toast("No save found."); return false; }
  try{
    const payload = JSON.parse(raw);
    state = payload;
    ensureUiDefaults();
    bindRng();
    initWorld(false);
    recalcSkillEffects();
    toast("Loaded.");
    return true;
  }catch(e){
    console.error(e);
    toast("Save corrupted.");
    return false;
  }
}
function newGame(){
  state = DEFAULT_STATE();
  ensureUiDefaults();
  bindRng();
  initWorld(false);
  recalcSkillEffects();
  state.log = [];
  addLog("system", "You shoulder your pack and face the horizon. The road does not end — it only changes.", { key:"NEW RUN" });
  refreshAll();
}

// ---------- Utility ----------
function fmtTime(minOfDay){
  let h = Math.floor(minOfDay/60) % 24;
  let m = minOfDay % 60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function phaseOfDay(minOfDay){
  const h = Math.floor(minOfDay/60);
  if (h >= 5 && h < 8) return "Dawn";
  if (h >= 8 && h < 12) return "Morning";
  if (h >= 12 && h < 17) return "Afternoon";
  if (h >= 17 && h < 20) return "Dusk";
  return "Night";
}
function isNight(){
  const h = Math.floor(state.minuteOfDay/60);
  return (h >= 20 || h < 5);
}
function currentWeather(){
  return CONTENT.weather.types.find(w=>w.id===state.weatherId) || CONTENT.weather.types[0];
}
function bindRng(){
  rng = mulberry32(state.seed >>> 0);
  // Advance RNG a bit based on tick for more variety while preserving determinism in saves
  for (let i=0;i< (state.tick % 37); i++) rng();
}

// ---------- Environment / Biomes ----------
function currentBiome(){
  const id = state.world && state.world.biomeId ? state.world.biomeId : "urban";
  return CONTENT.world.biomes.find(b=>b.id===id) || CONTENT.world.biomes[0];
}
function rint(a,b){ return Math.floor(lerp(a, b+1, rng())); }

function initWorld(force=false){
  if (!state.world || force){
    state.world = { miles:0, biomeId:"urban", milesLeft: rint(CONTENT.world.bandMiles[0], CONTENT.world.bandMiles[1]), lastAmbient:"", changed:true };
  }
  // pick initial biome deterministically from seed on first run
  if (!state.world.biomeId){
    const biomes = CONTENT.world.biomes;
    const idx = Math.floor((state.seed % 997) / 997 * biomes.length);
    state.world.biomeId = biomes[idx].id;
    state.world.changed = true;
  }
  if (!state.world.milesLeft || state.world.milesLeft<=0){
    state.world.milesLeft = rint(CONTENT.world.bandMiles[0], CONTENT.world.bandMiles[1]);
  }
  // sync legacy distance
  if (typeof state.distance !== "number") state.distance = 0;
  state.distance = Math.floor(state.world.miles);
}

function pickNextBiome(fromId){
  const list = CONTENT.world.transitions[fromId] || CONTENT.world.transitions.urban;
  const pickd = pickWeighted(rng, list.map(x=>({ w:x.w, v:x.to })));
  return pickd;
}

function updateAmbient(force=false){
  const b = currentBiome();
  const line = pick(rng, b.ambient);
  state.world.lastAmbient = line;
  if (force){
    addLog("event", `<b>${escapeHtml(b.name)}</b> — ${escapeHtml(line)}`, { key:"ENV" }, true);
  }
}

function advanceWorldByMiles(miles){
  if (!state.world) initWorld();
  state.world.miles += miles;
  state.distance = Math.floor(state.world.miles);

  state.world.milesLeft -= miles;
  if (state.world.milesLeft <= 0){
    const from = state.world.biomeId || "urban";
    const to = pickNextBiome(from);
    state.world.biomeId = to;
    state.world.milesLeft = rint(CONTENT.world.bandMiles[0], CONTENT.world.bandMiles[1]);
    state.world.changed = true;
    updateAmbient(true);
  }else{
    // occasionally refresh ambience
    if (state.world.changed){
      updateAmbient(true);
      state.world.changed = false;
    }else if (chance(rng, 0.25)){
      updateAmbient(false);
    }
  }
}

function travelEncounterTable(){
  const base = CONTENT.encounters.travel;
  const b = currentBiome();
  if (!b.extraEncounters || b.extraEncounters.length===0) return base;
  // merge with small biome flavor without changing base weights
  return base.concat(b.extraEncounters);
}

function pickLocationTemplate(){
  const b = currentBiome();
  const list = CONTENT.locations.templates;
  // biome weighting by template id
  const weights = (b.locWeights || {});
  const pool = list.map(t=>{
    const w = weights[t.id] || weights[t.tplId] || 1;
    return { w: Math.max(0.15, w), v: t };
  });
  return pickWeighted(rng, pool);
}


function toast(msg){
  addLog("system", msg, { key:"NOTE" }, true);
}

// ---------- Logging ----------
function addLog(type, text, meta={}, quiet=false){
  const w = currentWeather();
  const entry = {
    t: Date.now(),
    day: state.day,
    time: fmtTime(state.minuteOfDay),
    phase: phaseOfDay(state.minuteOfDay),
    weather: w.name,
    type,
    key: meta.key || (type==="system" ? "SYSTEM" : type.toUpperCase()),
    text
  };
  state.log.push(entry);
  if (!quiet) refreshLog();
}
function refreshLog(){
  const el = document.getElementById("log");
  el.innerHTML = "";
  const max = 120; // show latest
  const slice = state.log.slice(-max);
  const startIndex = Math.max(0, state.log.length - slice.length);
  const now = Date.now();
  for (let i=0;i<slice.length;i++){
    const e = slice[i];
    const globalIndex = startIndex + i;
    const isNew = (state.ui && typeof state.ui.newFromLen==="number") ? (globalIndex >= state.ui.newFromLen) : false;
    const pulse = isNew && (state.ui && now < (state.ui.pulseUntil||0));
    const div = document.createElement("div");
    div.className = "entry" + (isNew ? " new" : "") + (pulse ? " pulse" : "");
    div.innerHTML = `
      <div class="t">
        <span class="k">${escapeHtml(e.key)}</span>${isNew ? `<span class="k newtag">NEW</span>` : ``}
        <span>Day ${e.day} • ${escapeHtml(e.time)} • ${escapeHtml(e.phase)} • ${escapeHtml(e.weather)}</span>
      </div>
      <div class="c">${e.text}</div>
    `;
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
}

// ---------- HTML helpers ----------
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[s]));
}

// ---------- Stats / Effects ----------
function maxCarry(){
  const base = CONTENT.config.baseCarry;
  const g = gearStats();
  return (base * state.skills.mods.carryMult) + (g.carry || 0);
}
function invWeight(){
  let w = 0;
  for (const it of state.inv.items){
    const def = CONTENT.items.defs[it.id];
    if (!def) continue;
    w += (def.weight || 0) * (it.q || 1);
  }
  return w;
}

// ---------- Grid Inventory (slots + weight) ----------
const BASE_GRID = { w: 6, h: 4 }; // base pockets without a backpack

function getGridDims(){
  const backId = state.inv && state.inv.gear ? state.inv.gear.back : null;
  const backDef = backId ? CONTENT.items.defs[backId] : null;
  const g = backDef ? (backDef.clothing || backDef.gear || {}) : {};
  const w = g.gridW || BASE_GRID.w;
  const h = g.gridH || BASE_GRID.h;
  return { w: Math.max(4, Math.min(14, w)), h: Math.max(3, Math.min(10, h)) };
}

function getItemSize(def){
  if (!def) return { w:1, h:1 };
  if (def.size && Array.isArray(def.size)) return { w: def.size[0]||1, h: def.size[1]||1 };

  // Heuristic defaults (easy to tune)
  const id = def._id || null;
  const map = {
    knife:[1,2], pipe:[1,3], pistol:[2,2], molotov:[1,2],
    jacket:[2,2], poncho:[2,2], boots:[2,2],
    medkit:[2,2], antiseptic:[1,1], bandage:[1,1], painkillers:[1,1],
    water:[1,1], canned_food:[1,1], energy_bar:[1,1], jerky:[1,1],
    ammo_9mm:[1,1], scrap:[1,1], alcohol:[1,1], cloth:[1,1], lighter:[1,1],
    backpack_small:[2,3], backpack_hiker:[2,3],
    satchel_canvas:[2,2], sling_bag:[2,2], school_backpack:[2,3], messenger_bag:[2,2],
    duffel_bag:[3,2], hiking_pack:[2,3], frame_pack:[3,3], drybag_rolltop:[2,3],
    rucksack_military:[3,3], tactical_pack:[3,3], improvised_pack:[2,3], tool_roll:[3,1],
    moto_helmet:[2,2], work_gloves:[2,1], cargo_pants:[2,2], knee_brace:[2,1], ankle_wrap:[1,2]
  };
  if (id && map[id]) return { w: map[id][0], h: map[id][1] };

  if (def.type === "weapon") return { w:2, h:1 };
  if (def.type === "clothing" || def.type === "armor" || def.type === "gear") return { w:2, h:2 };
  return { w:1, h:1 };
}

function ensureStackIds(){
  state.inv = state.inv || { items:[], gear:{} };
  state.inv.items = Array.isArray(state.inv.items) ? state.inv.items : [];
  for (const it of state.inv.items){
    if (!it.sid) it.sid = uid("stk");
  }
}

function packInventory(items){
  const dims = getGridDims();
  const W = dims.w, H = dims.h;

  // occupancy grid
  const occ = Array.from({length:H}, ()=>Array(W).fill(null));
  const placements = [];
  const overflow = [];

  // sort by area desc, stable by sid
  const sorted = items.slice().map((it, idx)=>({it, idx})).sort((a,b)=>{
    const da = CONTENT.items.defs[a.it.id]; if (da) da._id = a.it.id;
    const db = CONTENT.items.defs[b.it.id]; if (db) db._id = b.it.id;
    const sa = getItemSize(da); const sb = getItemSize(db);
    const aa = sa.w*sa.h, ab = sb.w*sb.h;
    if (ab !== aa) return ab - aa;
    return String(a.it.sid).localeCompare(String(b.it.sid));
  });

  function fits(x,y,w,h){
    if (x+w > W || y+h > H) return false;
    for (let yy=y; yy<y+h; yy++){
      for (let xx=x; xx<x+w; xx++){
        if (occ[yy][xx]) return false;
      }
    }
    return true;
  }
  function place(x,y,w,h, sid){
    for (let yy=y; yy<y+h; yy++){
      for (let xx=x; xx<x+w; xx++){
        occ[yy][xx] = sid;
      }
    }
  }

  for (const entry of sorted){
    const it = entry.it;
    const def = CONTENT.items.defs[it.id]; if (def) def._id = it.id;
    const sz = getItemSize(def);
    let placed = false;
    for (let y=0; y<H && !placed; y++){
      for (let x=0; x<W && !placed; x++){
        if (fits(x,y,sz.w,sz.h)){
          place(x,y,sz.w,sz.h,it.sid);
          placements.push({ sid: it.sid, id: it.id, q: it.q, x, y, w: sz.w, h: sz.h });
          placed = true;
        }
      }
    }
    if (!placed){
      overflow.push(it.sid);
    }
  }

  const usedCells = occ.flat().filter(Boolean).length;
  return { ok: overflow.length===0, dims, placements, overflow, usedCells, totalCells: W*H };
}

function repackInventory(){
  ensureStackIds();
  const res = packInventory(state.inv.items);
  state.inv.grid = {
    w: res.dims.w,
    h: res.dims.h,
    placements: res.placements,
    overflow: res.overflow,
    usedCells: res.usedCells,
    totalCells: res.totalCells
  };
  return res;
}

function simulateAddItem(id, q){
  ensureStackIds();
  const def = CONTENT.items.defs[id];
  if (!def) return { ok:false, reason:"unknown" };

  // clone items
  const items = state.inv.items.map(x=>({ id:x.id, q:x.q, sid:x.sid }));
  const stack = def.stack || 1;
  let remaining = q;

  // fill existing
  for (const it of items){
    if (it.id !== id) continue;
    const can = Math.max(0, stack - it.q);
    const take = Math.min(can, remaining);
    it.q += take;
    remaining -= take;
    if (remaining <= 0) break;
  }
  // add new stacks
  while (remaining > 0){
    const take = Math.min(stack, remaining);
    items.push({ id, q: take, sid: uid("stk") });
    remaining -= take;
  }

  const res = packInventory(items);
  if (!res.ok) return { ok:false, reason:"slots", res };
  return { ok:true, items, res };
}

function tryAddItem(id, q){
  const sim = simulateAddItem(id, q);
  if (!sim.ok) return sim;
  state.inv.items = sim.items;
  // update grid cache
  repackInventory();
  return { ok:true };
}

function afterInventoryChange(){
  repackInventory();
}


function hasItem(id, q=1){
  const it = state.inv.items.find(x=>x.id===id);
  return it && it.q >= q;
}
function addItem(id, q=1){
  // Kept for compatibility. Uses slot-based grid check.
  const r = tryAddItem(id, q);
  return !!r.ok;
}
function removeItem(id, q=1){
  ensureStackIds();
  let remaining = q;
  for (let i=state.inv.items.length-1;i>=0;i--){
    const it = state.inv.items[i];
    if (it.id!==id) continue;
    const take = Math.min(it.q, remaining);
    it.q -= take;
    remaining -= take;
    if (it.q <= 0) state.inv.items.splice(i,1);
    if (remaining <= 0) break;
  }
  afterInventoryChange();
  return remaining <= 0;
}
function equippedWeaponDef(){
  const wid = state.inv.gear.weapon;
  const def = wid ? CONTENT.items.defs[wid] : null;
  return def && def.weapon ? def : null;
}


// ---------- Equipment Slots ----------
const EQUIP_SLOTS = [
  { id:"weapon", label:"Weapon" },
  { id:"head", label:"Head" },
  { id:"body", label:"Body" },
  { id:"arms", label:"Arms" },
  { id:"legs", label:"Legs" },
  { id:"ankles", label:"Ankles" },
  { id:"back", label:"Back" },
];

function getEquipSlotForItem(def){
  if (!def) return null;
  if (def.equip && def.equip.slot) return def.equip.slot;
  if (def.type === "weapon") return "weapon";
  if (def.type === "clothing") return "body";
  return null;
}
function isItemEquipped(itemId){
  for (const s of Object.keys(state.inv.gear || {})){
    if (state.inv.gear[s] === itemId) return s;
  }
  return null;
}
function unequipSlot(slot){
  if (!state.inv.gear) state.inv.gear = {};
  const cur = state.inv.gear[slot];
  const prevBack = state.inv.gear.back;
  if (!cur) return;
  if (slot === "back"){
    state.inv.gear.back = null;
    const res = packInventory(state.inv.items);
    if (!res.ok){
      // revert
      state.inv.gear.back = prevBack || null;
      toast("You can’t remove your pack — items won’t fit. Drop/rearrange first.");
      return;
    }
  }

  state.inv.gear[slot] = null;
  const def = CONTENT.items.defs[cur];
  addLog("system", `Unequipped: <b>${escapeHtml(def?def.name:cur)}</b> (${escapeHtml(slot)}).`, { key:"GEAR" }, true);
}
function equipItem(itemId){
  const def = CONTENT.items.defs[itemId];
  if (!def) return;
  if (!hasItem(itemId, 1)) return toast("You don't have that.");
  const slot = getEquipSlotForItem(def);
  // If equipping a backpack changes grid size, ensure everything still fits.
  const prevBack = state.inv.gear.back;
  const prevSlotVal = state.inv.gear[slot];

  if (!slot) return toast("That can't be equipped.");

  // If it is equipped elsewhere, clear it
  const already = isItemEquipped(itemId);
  if (already && already !== slot) state.inv.gear[already] = null;

  // Toggle off if same item already equipped
  if (state.inv.gear[slot] === itemId){
    unequipSlot(slot);
    refreshAll();
    return;
  }
  // Preview change for back slot
  if (slot === "back"){
    // apply temporarily
    state.inv.gear.back = itemId;
    const res = packInventory(state.inv.items);
    if (!res.ok){
      // revert
      state.inv.gear.back = prevBack || null;
      toast("Not enough inventory space for that pack. Free up slots first.");
      return;
    }
  }


  state.inv.gear[slot] = itemId;
  addLog("system", `Equipped: <b>${escapeHtml(def.name)}</b> (${escapeHtml(slot)}).`, { key:"GEAR" }, true);
  refreshAll();
}

function equippedGearDefs(){
  // All equipped non-weapon gear by slot
  const slots = ["head","body","arms","legs","ankles","back"];
  const out = [];
  for (const s of slots){
    const id = state.inv.gear[s];
    if (!id) continue;
    const def = CONTENT.items.defs[id];
    if (def) out.push(def);
  }
  return out;
}
function gearStats(){
  // Aggregates warmth / waterproof / travel bonus / carry bonus / armor mitigation
  const gear = equippedGearDefs();
  return gear.reduce((acc, item)=>{
    const g = item.clothing || item.gear || {};
    acc.warmth += g.warmth || 0;
    acc.waterproof += g.waterproof || 0;
    acc.travelBonus += g.travelBonus || 0;
    acc.carry += g.carry || 0;
    acc.armor += g.armor || 0;
    return acc;
  }, { warmth:0, waterproof:0, travelBonus:0, carry:0, armor:0 });
}

function addXP(amount, reason=""){
  if (amount <= 0) return;
  state.stats.xp += amount;
  addLog("system", `+${amount} XP ${reason ? "• "+escapeHtml(reason) : ""}`, { key:"XP" }, true);
  // level curve
  while (state.stats.xp >= xpToNext(state.stats.level)){
    state.stats.xp -= xpToNext(state.stats.level);
    state.stats.level += 1;
    state.stats.skillPoints += 1;
    state.stats.maxHealth += 2;
    state.stats.health = Math.min(state.stats.health + 2, state.stats.maxHealth);
    addLog("system", `<b>Level up!</b> You reach Level ${state.stats.level}. +1 Skill Point.`, { key:"LEVEL" });
  }
}
function xpToNext(level){
  return Math.floor(60 + Math.pow(level, 1.25)*35);
}

function applyStatDelta(delta){
  // delta keys: health/hunger/thirst/temp/damp/mood/energy
  const s = state.stats;
  for (const [k,v] of Object.entries(delta)){
    if (k==="health"){
      s.health = clamp(s.health + v, 0, s.maxHealth);
    }else if (k==="temperature"){
      s.temperature = clamp(s.temperature + v, 0, 100);
    }else if (k==="dampness"){
      s.dampness = clamp(s.dampness + v, 0, 100);
    }else if (k==="xp"){
      addXP(v);
    }else{
      if (!(k in s)) continue;
      s[k] = clamp(s[k] + v, 0, 100);
    }
  }
}

// ---------- Injuries ----------
function addInjury(template){
  const inj = {
    id: uid("inj"),
    name: template.name,
    part: normalizePart(template.part),
    severity: template.severity, // 1..3
    bleeding: template.bleeding || 0, // 0..3
    infected: template.infected || 0, // 0..3
    pain: template.pain || 1, // 1..3
    desc: template.desc || ""
  };
  state.injuries.push(inj);
  addLog("injury", `<b>Injury:</b> ${escapeHtml(inj.name)} (${escapeHtml(inj.part)}) — ${escapeHtml(inj.desc)}`, { key:"INJURY" });
}

function bleedingLevel(){
  return state.injuries.reduce((m,i)=>m + (i.bleeding||0), 0);
}
function infectionLevel(){
  return state.injuries.reduce((m,i)=>m + (i.infected||0), 0);
}
function painLevel(){
  return state.injuries.reduce((m,i)=>m + (i.pain||0), 0);
}

const BODY_PARTS = ["Head","Torso","Left Arm","Right Arm","Left Leg","Right Leg"];

function normalizePart(part){
  const p = String(part||"").trim();
  if (!p) return "Torso";
  if (p === "Arm") return "Left Arm";
  if (p === "Leg") return "Left Leg";
  if (p === "Head" || p === "Torso" || p === "Left Arm" || p === "Right Arm" || p === "Left Leg" || p === "Right Leg") return p;

  const low = p.toLowerCase();
  if (low.includes("head")) return "Head";
  if (low.includes("torso") || low.includes("rib") || low.includes("chest")) return "Torso";
  if (low.includes("arm") && low.includes("right")) return "Right Arm";
  if (low.includes("arm")) return "Left Arm";
  if (low.includes("leg") && low.includes("right")) return "Right Leg";
  if (low.includes("leg")) return "Left Leg";
  return "Torso";
}

function injuriesForPart(part){
  const norm = normalizePart(part);
  return (state.injuries||[]).filter(i => normalizePart(i.part) === norm);
}

function partSummary(part){
  const arr = injuriesForPart(part);
  let sevMax=0, bleed=0, inf=0, pain=0;
  for (const i of arr){
    sevMax = Math.max(sevMax, i.severity||0);
    bleed += i.bleeding||0;
    inf += i.infected||0;
    pain += i.pain||0;
  }
  const level = arr.length===0 ? "good" : ((bleed>=2 || inf>=2 || sevMax>=3) ? "danger" : "warn");
  return { arr, sevMax, bleed, inf, pain, level };
}

function ensureUiDefaults(){
  state.ui = state.ui || {};
  if (!state.ui.selectedBodyPart) state.ui.selectedBodyPart = "Torso";
  if (!state.ui.selectedEquipSlot) state.ui.selectedEquipSlot = "weapon";
  if (typeof state.ui.codexQuery !== "string") state.ui.codexQuery = "";
  // Log highlighting: mark existing entries as read
  if (typeof state.ui.newFromLen !== "number") state.ui.newFromLen = (Array.isArray(state.log) ? state.log.length : 0);
  if (typeof state.ui.pulseUntil !== "number") state.ui.pulseUntil = 0;

  // Injuries normalization
  if (!Array.isArray(state.injuries)) state.injuries = [];
  for (const inj of state.injuries){
    inj.part = normalizePart(inj.part);
  }

  // Inventory/gear defaults + migration from older saves
  state.inv = state.inv || { items:[], gear:{} };
  state.inv.items = Array.isArray(state.inv.items) ? state.inv.items : [];

  state.inv.gear = state.inv.gear || {};

  // Migration: older versions used gear.clothing:[...]
  if (Array.isArray(state.inv.gear.clothing)){
    const clothing = state.inv.gear.clothing.slice();
    for (const id of clothing){
      const def = CONTENT.items.defs[id];
      const slot = def && def.equip ? def.equip.slot : (def && def.type==="clothing" ? "body" : null);
      if (slot && !state.inv.gear[slot]) state.inv.gear[slot] = id;
    }
    delete state.inv.gear.clothing;
  }

  // Ensure all slots exist
  const slots = ["weapon","head","body","arms","legs","ankles","back"];
  for (const s of slots){
    if (!(s in state.inv.gear)) state.inv.gear[s] = (s==="weapon" ? (state.inv.gear.weapon || "knife") : null);
  }
  if (!state.inv.gear.weapon) state.inv.gear.weapon = "knife";


  // Grid inventory cache
  ensureStackIds();
  repackInventory();

  state.ui.craft = state.ui.craft || { cat:"all", query:"", sel:null };
}



function applyMedicalToPart(itemId, part){
  const p = normalizePart(part);
  const def = CONTENT.items.defs[itemId];
  if (!def) return;
  if (!hasItem(itemId, 1)) return toast("You don't have that.");

  const wounds = injuriesForPart(p);
  const bleed = wounds.reduce((s,i)=>s+(i.bleeding||0),0);
  const inf = wounds.reduce((s,i)=>s+(i.infected||0),0);
  const pain = wounds.reduce((s,i)=>s+(i.pain||0),0);

  // Guard rails so it feels intentional
  if (itemId === "bandage" && (wounds.length===0 || bleed<=0)) return toast("No bleeding on that body part.");
  if (itemId === "antiseptic" && (wounds.length===0 || inf<=0)) return toast("No infection on that body part.");
  if (itemId === "painkillers" && (wounds.length===0 || pain<=0)) return toast("No pain to treat on that body part.");
  if (itemId === "medkit" && (wounds.length===0 && state.stats.health >= state.stats.maxHealth)) return toast("No wounds there, and you're already at full health.");

  removeItem(itemId, 1);

  // time + narration
  if (def.useText) addLog("system", escapeHtml(def.useText), { key:"USE" }, true);

  if (itemId === "bandage"){
    advanceMinutes(6, "rest");
    let fixed = 0;
    for (const inj of wounds){
      if (inj.bleeding > 0){ inj.bleeding = Math.max(0, inj.bleeding-1); fixed++; }
    }
    addLog("system", `You wrap your <b>${escapeHtml(p)}</b>. Bleeding reduced in ${fixed} wound(s).`, { key:"TREAT" });
    applyStatDelta({ mood:+1 });
  }else if (itemId === "antiseptic"){
    advanceMinutes(6, "rest");
    let fixed = 0;
    for (const inj of wounds){
      if (inj.infected > 0){ inj.infected = Math.max(0, inj.infected-1); fixed++; }
    }
    addLog("system", `You disinfect your <b>${escapeHtml(p)}</b>. Infection reduced in ${fixed} wound(s).`, { key:"TREAT" });
    applyStatDelta({ mood:-1 });
  }else if (itemId === "painkillers"){
    advanceMinutes(4, "rest");
    let fixed = 0;
    for (const inj of wounds){
      if (inj.pain > 0){ inj.pain = Math.max(0, inj.pain-1); fixed++; }
    }
    applyStatDelta({ mood:+3, energy:+2 });
    addLog("system", `Pain eases in your <b>${escapeHtml(p)}</b>.`, { key:"TREAT" });
  }else if (itemId === "medkit"){
    advanceMinutes(10, "rest");
    applyStatDelta({ health:+30, mood:+2 });
    let b=0,i=0,pa=0;
    for (const inj of wounds){
      if (inj.bleeding > 0){ inj.bleeding = Math.max(0, inj.bleeding-1); b++; }
      if (inj.infected > 0){ inj.infected = Math.max(0, inj.infected-1); i++; }
      if (inj.pain > 0){ inj.pain = Math.max(0, inj.pain-1); pa++; }
    }
    addLog("system", `You treat your <b>${escapeHtml(p)}</b> carefully. (Bleed -${b}, Inf -${i}, Pain -${pa})`, { key:"MEDKIT" });
  }else{
    // generic consumables/medical fallback
    if (def.effects) applyStatDelta(def.effects);
    if (def.specials) def.specials.forEach(resolveMedicalSpecial);
    advanceMinutes(4, "rest");
  }

  refreshAll();
}

function resolveMedicalSpecial(special){
  if (special==="stopBleeding"){
    let fixed = 0;
    for (const inj of state.injuries){
      if (inj.bleeding > 0){ inj.bleeding = Math.max(0, inj.bleeding-1); fixed++; }
    }
    if (fixed>0) addLog("system", `Bleeding reduced in ${fixed} wound(s).`, { key:"TREAT" }, true);
    else addLog("system", "No active bleeding to treat.", { key:"TREAT" }, true);
  }
  if (special==="reduceInfection"){
    let fixed = 0;
    for (const inj of state.injuries){
      if (inj.infected > 0){ inj.infected = Math.max(0, inj.infected-1); fixed++; }
    }
    if (fixed>0) addLog("system", `Infection reduced in ${fixed} wound(s).`, { key:"TREAT" }, true);
    else addLog("system", "No infected wounds to treat.", { key:"TREAT" }, true);
  }
  if (special==="reducePain"){
    // pain is abstracted via mood/energy; we just bump both a little + reduce pain
    let fixed = 0;
    for (const inj of state.injuries){
      if (inj.pain > 0){ inj.pain = Math.max(0, inj.pain-1); fixed++; }
    }
    applyStatDelta({ mood:+2, energy:+1 });
    if (fixed>0) addLog("system", "Pain eases a little.", { key:"TREAT" }, true);
  }
}

// ---------- Skill System ----------
function recalcSkillEffects(){
  // reset mods/flags, then apply all owned nodes
  const base = DEFAULT_STATE().skills;
  state.skills.mods = deepClone(base.mods);
  state.skills.flags = deepClone(base.flags);

  const owned = new Set(state.skills.owned || []);
  for (const node of CONTENT.skills.nodes){
    if (!owned.has(node.id)) continue;
    try{ node.apply(state.skills); }catch(e){ console.warn("Skill apply failed", node.id, e); }
  }
}
function canBuySkill(node){
  if ((state.skills.owned||[]).includes(node.id)) return { ok:false, why:"Already owned." };
  if (state.stats.skillPoints < node.cost) return { ok:false, why:"Not enough Skill Points." };
  const owned = new Set(state.skills.owned||[]);
  for (const r of node.req){
    if (!owned.has(r)) return { ok:false, why:"Missing prerequisite." };
  }
  return { ok:true };
}
function buySkill(nodeId){
  const node = CONTENT.skills.nodes.find(n=>n.id===nodeId);
  if (!node) return;
  const chk = canBuySkill(node);
  if (!chk.ok){ toast(chk.why); return; }
  state.stats.skillPoints -= node.cost;
  state.skills.owned.push(node.id);
  recalcSkillEffects();
  addLog("system", `<b>Skill learned:</b> ${escapeHtml(node.name)}.`, { key:"SKILL" });
  refreshAll();
}

// ---------- World Tick / Survival ----------
function calcThreat(){
  const w = currentWeather();
  const biome = currentBiome();
  let t = state.threatBase + (w.threatMod || 0) + (biome.threatMod || 0);
  if (isNight()) t += CONTENT.config.nightThreatBonus;
  if (w.id==="storm") t += CONTENT.config.stormThreatBonus;
  // injuries make you noisier / slower
  const bleed = bleedingLevel();
  const inf = infectionLevel();
  const pain = painLevel();
  t += bleed * 0.02 + inf * 0.015 + pain * 0.01;
  // mood low = mistakes
  t += (1 - clamp(state.stats.mood/100,0,1)) * 0.06;
  // clamp
  return clamp(t, 0.05, 0.75);
}

function advanceMinutes(mins, reason="time"){
  if (mins <= 0) return;
  // break into 10-min steps for smoother survival ticks
  let left = mins;
  while (left > 0){
    const step = Math.min(10, left);
    left -= step;
    state.tick += step;
    state.minuteOfDay += step;
    if (state.minuteOfDay >= 24*60){
      state.minuteOfDay -= 24*60;
      state.day += 1;
      addLog("system", `<b>Day ${state.day}</b>. The world stays the same. You keep moving.`, { key:"DAY" }, true);
    }

    // Weather timer and potential shift
    state.weatherTimer -= step;
    if (state.weatherTimer <= 0){
      maybeShiftWeather();
      state.weatherTimer = Math.floor(90 + rng()*210); // 1.5h to 5h
    }

    // Survival ticks
    tickNeeds(step, reason);
    tickInjuries(step);
    tickTemperature(step);
    tickMood(step);

    // death check
    if (state.stats.health <= 0){
      state.stats.health = 0;
      state.context = { mode:"event", event:{ title:"Silence", text:"The road takes everything. Your vision narrows to a pinprick of light — then nothing.", options:[ { label:"Start a new run", action:"new_game" } ] } };
      addLog("system", "<b>You died.</b> The journey ends here — but you can begin again.", { key:"DEATH" });
      break;
    }
  }
}

function maybeShiftWeather(){
  const cur = currentWeather();
  // weighted toward staying similar
  const pool = CONTENT.weather.types;
  const next = pickWeighted(rng, pool.map(w=>{
    const same = (w.id===cur.id);
    // prefer staying or small changes
    let wgt = same ? 40 : 12;
    if ((cur.id==="rain"||cur.id==="storm") && (w.id==="overcast"||w.id==="rain")) wgt += 6;
    if (cur.id==="clear" && (w.id==="overcast"||w.id==="fog")) wgt += 5;
    if (cur.id==="snow" && (w.id==="overcast"||w.id==="snow")) wgt += 5;
    const b = currentBiome();
    const bias = (b.weatherBias && b.weatherBias[w.id]) ? b.weatherBias[w.id] : 1.0;
    wgt = Math.max(1, Math.floor(wgt * bias));
    return { w: wgt, v: w.id };
  }));
  state.weatherId = next;
}

function tickNeeds(step, reason){
  // metabolism based on activity
  const active = (reason==="travel" || reason==="search" || reason==="combat");
  const mult = state.skills.mods.metabolismMult * (active ? 1.12 : 0.92);

  // hunger/thirst down
  const hungerLoss = 0.065 * step * mult;
  const thirstLoss = 0.085 * step * mult;

  // energy down (higher during travel/combat)
  let energyLoss = 0.05 * step * (active ? 1.35 : 0.6);
  if (reason==="travel") energyLoss *= state.skills.mods.travelEnergyMult;

  applyStatDelta({
    hunger: -hungerLoss,
    thirst: -thirstLoss,
    energy: -energyLoss
  });

  // starvation/dehydration penalties
  if (state.stats.hunger < 15) applyStatDelta({ mood:-0.04*step, health:-0.02*step });
  if (state.stats.thirst < 15) applyStatDelta({ mood:-0.05*step, health:-0.03*step });

  // exhaustion penalties
  if (state.stats.energy < 10){
    applyStatDelta({ mood:-0.05*step, health:-0.02*step });
  }
}

function tickInjuries(step){
  const bleed = bleedingLevel();
  const inf = infectionLevel();

  if (bleed > 0){
    const bleedDmg = bleed * 0.03 * step * state.skills.mods.bleedTickMult;
    applyStatDelta({ health:-bleedDmg, mood:-0.02*step*state.skills.mods.injuryMoodMult });
  }
  if (inf > 0){
    const infDmg = inf * 0.02 * step;
    applyStatDelta({ health:-infDmg, mood:-0.03*step*state.skills.mods.injuryMoodMult, energy:-0.02*step });
  }
}

function tickTemperature(step){
  const w = currentWeather();
  const clothes = gearStats();
  const biome = currentBiome();

  // baseline comfort pull
  let target = 50;
  target += w.tempMod * 1.8;
  if (isNight()) target -= 3;
  target += (biome.tempBias || 0);

  // clothing warmth offsets cold
  target += clothes.warmth * 1.2;

  // dampness reduces warmth effectiveness
  const damp = state.stats.dampness/100;
  target -= damp * (6 - clothes.waterproof*0.7);

  // stabilize toward target
  const stabilize = 0.016 * step * (1 + state.skills.mods.tempStabilize);
  state.stats.temperature = clamp( lerp(state.stats.temperature, target, stabilize), 0, 100);

  // dampness changes by weather, reduced by waterproof + skill
  let dampRate = (w.dampRate || 0);
  dampRate += (biome.dampBias || 0); // per hour-ish idea; we scale by step
  dampRate -= clothes.waterproof * 0.8;
  dampRate *= state.skills.mods.dampGainMult;
  state.stats.dampness = clamp(state.stats.dampness + (dampRate * (step/60))*10, 0, 100);

  // temperature penalties
  if (state.stats.temperature < 30){
    const d = (30 - state.stats.temperature)/30;
    applyStatDelta({ mood:-(0.06*d*step), energy:-(0.05*d*step), health:-(0.015*d*step) });
  }
  if (state.stats.temperature > 70){
    const d = (state.stats.temperature - 70)/30;
    applyStatDelta({ mood:-(0.05*d*step), thirst:-(0.06*d*step), health:-(0.01*d*step) });
  }
}

function tickMood(step){
  // small drift toward 60 baseline
  const base = 60;
  const t = 0.006 * step;
  state.stats.mood = clamp( lerp(state.stats.mood, base, t), 0, 100 );

  // pain adds extra drain
  const pain = painLevel();
  if (pain > 0){
    applyStatDelta({ mood: -0.02 * pain * step * state.skills.mods.injuryMoodMult });
  }
}

// ---------- Encounter Generation ----------
function travel(){
  if (state.context.mode !== "travel") return;

  // carry penalty
  const over = invWeight() - maxCarry();
  if (over > 0){
    addLog("system", `<b>Your pack is too heavy.</b> You're over capacity by ${over.toFixed(1)}. You move slower and waste energy.`, { key:"PACK" });
  }

  const w = currentWeather();
  const clothes = gearStats();

  // travel minutes and distance
  let mins = Math.floor( lerp(CONTENT.config.travelMinutesRange[0], CONTENT.config.travelMinutesRange[1], rng()) );
  // boots travel bonus
  mins = Math.max(25, Math.floor(mins * (1 - clothes.travelBonus)));
  // overweight slows
  if (over > 0) mins = Math.floor(mins * (1 + clamp(over / 10, 0.05, 0.35)));

  // risk baseline
  const threat = calcThreat();

  // update
  advanceMinutes(mins, "travel");
    // miles traveled (biome-aware)
  let miles = (mins / 60) * 2.2;
  if (w.id==="storm"||w.id==="snow") miles *= 0.75;
  else if (w.id==="rain"||w.id==="fog") miles *= 0.85;
  if (over > 0) miles *= (1 - clamp(over / 18, 0.05, 0.35));
  miles = clamp(miles, 0.4, 3.2);
  advanceWorldByMiles(miles);

  addXP(Math.floor(2 + mins/35), "Travel");

  if (state.stats.health <= 0) { refreshAll(); return; }

  // choose encounter
  const encounter = pickWeighted(rng, travelEncounterTable());

  // adjust chance of "quiet" vs danger with threat
  let forcedDanger = chance(rng, threat * 0.55);

  if (encounter.type === "quiet" && forcedDanger){
    // bump to danger
    const d = pickWeighted(rng, [
      { w: 55, v:{ type:"location" } },
      { w: 30, v:{ type:"infected" } },
      { w: 15, v:{ type:"ambush" } },
    ]);
    handleEncounter(d, threat);
  }else{
    handleEncounter(encounter, threat);
  }

  refreshAll();
}

function handleEncounter(enc, threat){
  if (enc.type === "quiet"){
    const lines = [
      "The road is empty. Wind in dead grass. Your boots keep time.",
      "Nothing moves but insects and drifting trash.",
      "You pass a burned-out billboard. The paint has peeled into ghost shapes.",
      "A silence so loud you can taste it. You keep walking."
    ];
    addLog("travel", pick(rng, lines), { key:"TRAVEL" });
    return;
  }

  if (enc.type === "event"){
    startEventFromTemplate(enc.id);
    return;
  }

  if (enc.type === "weather_shift"){
    const before = currentWeather().name;
    maybeShiftWeather();
    const after = currentWeather().name;
    addLog("travel", `The sky changes its mind. <b>${escapeHtml(before)}</b> becomes <b>${escapeHtml(after)}</b>.`, { key:"WEATHER" });
    return;
  }

  if (enc.type === "tracks"){
    startEventFromTemplate("tracks");
    return;
  }

  if (enc.type === "location"){
    spawnLocation();
    return;
  }

  if (enc.type === "infected"){
    startCombat(spawnEnemy(pickWeighted(rng, [
      { w: 60, v:"runner" },
      { w: 30, v:"stalker" },
      { w: 10, v:"clicker" },
    ])));
    return;
  }

  if (enc.type === "ambush"){
    startAmbush(threat);
    return;
  }
}

function startEventFromTemplate(id){
  const tpl = CONTENT.encounters.templates[id];
  if (!tpl) return;
  state.context = { mode:"event", event: deepClone(tpl) };
  addLog("event", tpl.text, { key: tpl.title.toUpperCase() });
}

// ---------- Generic Event Actions (data-driven) ----------
function runEventAction(action, payload){
  const act = (CONTENT.eventActions && CONTENT.eventActions[action]) ? CONTENT.eventActions[action] : null;
  if (!act) return false;

  // helper for random int in range
  const rint = (a,b)=>Math.floor(lerp(a, b+1, rng()));

  // optional: log
  if (act.log){
    const key = act.key || "EVENT";
    addLog("event", act.log, { key });
  }

  // optional: time
  if (act.time && Array.isArray(act.time) && act.time.length>=2){
    advanceMinutes(rint(act.time[0], act.time[1]), act.reason || "travel");
  }

  // optional: stats
  if (act.delta) applyStatDelta(act.delta);

  // optional: XP
  if (act.xp) addXP(act.xp, act.xpReason || "");

  // optional: loot
  if (act.lootTable){
    const rows = rollLoot(act.lootTable, 1 + (state.skills.mods.lootBonus||0));
    gainLoot(rows, act.lootReason || "Loot");
  }

  // optional: special inline loot rows
  if (act.lootRows && Array.isArray(act.lootRows)){
    gainLoot(act.lootRows, act.lootReason || "Loot");
  }

  // optional: spawn combat
  if (act.combat){
    const kind = act.combat.kind || "runner";
    startCombat(spawnEnemy(kind), act.combat.meta || {});
    refreshAll();
    return true;
  }

  // optional: spawn a location
  if (act.spawnLocation){
    spawnLocation();
    refreshAll();
    return true;
  }

  // optional: go to another event template (or chained event action)
  if (act.nextEvent){
    const nextId = act.nextEvent;
    const nextTpl = CONTENT.encounters && CONTENT.encounters.templates ? CONTENT.encounters.templates[nextId] : null;
    if (nextTpl){
      startEventFromTemplate(nextId);
      refreshAll();
      return true;
    }

    const nextAct = CONTENT.eventActions && CONTENT.eventActions[nextId] ? CONTENT.eventActions[nextId] : null;
    if (nextAct && nextId !== action){
      return runEventAction(nextId, payload);
    }

    addLog("system", `Event transition missing: <b>${escapeHtml(nextId)}</b>. Returning to travel.`, { key:"EVENT" });
    state.context = { mode:"travel" };
    refreshAll();
    return true;
  }

  // optional: go to inline event
  if (act.nextInline){
    state.context = { mode:"event", event: deepClone(act.nextInline) };
    addLog("event", state.context.event.text, { key: (state.context.event.title||"EVENT").toUpperCase() });
    refreshAll();
    return true;
  }

  // optional: set context
  if (act.to){
    if (act.to==="travel") state.context = { mode:"travel" };
    if (act.to==="camp") state.context = { mode:"camp" };
    if (act.to==="location"){
      const lid = act.locId || (payload && payload.locId) || (state.context && state.context.event && state.context.event.locId) || null;
      if (lid && state.discovered.locations[lid] && !state.discovered.locations[lid].left){
        state.context = { mode:"location", locId: lid, areaId: (state.discovered.locations[lid]?.areas[0]?.id || null) };
      }else{
        state.context = { mode:"travel" };
      }
    }
  }else{
    // default: back to travel
    state.context = { mode:"travel" };
  }

  refreshAll();
  return true;
}


function spawnLocation(){
  const tpl = pickLocationTemplate();
  const instId = uid("loc");

  const inst = {
    id: instId,
    tplId: tpl.id,
    name: tpl.name,
    vibe: tpl.vibe,
    areas: tpl.areas.map(a=>({
      id: a.id,
      name: a.name,
      desc: a.desc,
      loot: a.loot,
      searched: false,
      cleared: false
    })),
    entered: false,
    left: false
  };
  state.discovered.locations[instId] = inst;

  const evt = {
    title: tpl.name,
    text: `${escapeHtml(tpl.vibe)}<br><br><b>You spot it ahead.</b> Do you approach or keep moving?`,
    options:[
      { label:"Approach", action:"enter_location", locId: instId },
      { label:"Avoid", action:"avoid_location", locId: instId }
    ]
  };
  state.context = { mode:"event", event: evt };
  addLog("travel", `You spot a <b>${escapeHtml(tpl.name)}</b> near the road.`, { key:"LOCATION" });
}

function avoidLocation(locId){
  const loc = state.discovered.locations[locId];
  if (loc) loc.left = true;
  addLog("travel", "You keep moving. Some places aren't worth the risk.", { key:"TRAVEL" });
  state.context = { mode:"travel" };
  // small XP still
  addXP(2, "Caution");
}

function enterLocation(locId){
  const loc = state.discovered.locations[locId];
  if (!loc) { state.context = { mode:"travel" }; return; }
  loc.entered = true;

  // run onEnter hook
  const tpl = CONTENT.locations.templates.find(t=>t.id===loc.tplId);
  if (tpl && tpl.hooks && tpl.hooks.onEnter){
    const act = pickWeighted(rng, tpl.hooks.onEnter.map(h=>({ w:h.w, v:h.v })));
    if (act.type==="log"){
      addLog("location", act.text, { key:"ENTER" });
    }else if (act.type==="hazard"){
      // hazards can cause injury or noise
      if (act.kind==="noise"){
        addLog("location", `${act.text} You freeze, listening.`, { key:"NOISE" });
        // small chance to spawn an enemy due to noise
        const noiseP = 0.18 * state.skills.mods.searchNoiseMult;
        if (chance(rng, noiseP)){
          addLog("event", "A harsh rasp answers from somewhere inside.", { key:"ALERT" });
          startCombat(spawnEnemy("runner"), { from:"location" });
          return;
        }
      }else if (act.kind==="tripwire"){
        if (chance(rng, 0.40 * state.skills.mods.searchDangerMult)){
          addLog("location", "You spot it in time and step over.", { key:"SAFE" });
        }else{
          addLog("location", "Too late—your ankle catches. You hit the ground hard.", { key:"TRIPWIRE" });
          applyStatDelta({ health:-8, mood:-6, energy:-4 });
          addInjury({
            name:"Sprained Ankle",
            part:"Left Leg",
            severity:1,
            bleeding:0,
            infected:0,
            pain:1,
            desc:"Movement hurts. You’ll tire faster."
          });
        }
      }
    }else if (act.type==="encounter"){
      startEventFromTemplate(act.id);
      // keep location ready; player can choose to fight/leave etc
      state.context.event.locId = locId;
      return;
    }
  }

  // enter exploration
  state.context = { mode:"location", locId, areaId: loc.areas[0]?.id || null };
  addLog("location", `<b>${escapeHtml(loc.name)}</b> — choose where to search.`, { key:"EXPLORE" });
}

function leaveLocation(locId, soft=false){
  const loc = state.discovered.locations[locId];
  if (loc) loc.left = true;
  const text = soft
    ? "You back out slowly and melt into the roadside brush."
    : "You leave quickly. Staying longer feels like begging for trouble.";
  addLog("location", text, { key:"LEAVE" });
  state.context = { mode:"travel" };
}

// ---------- Ambush ----------
function startAmbush(threat){
  const resist = state.skills.mods.ambushResist || 0;
  const p = clamp(0.55 + threat*0.25 - resist, 0.25, 0.85);
  const evt = {
    title:"Ambush",
    text:"A shape breaks from cover. Another behind it. Not infected — <em>people</em>.<br><br>They want your pack.",
    options:[
      { label:"Try to talk", action:"ambush_talk" },
      { label:"Fight", action:"ambush_fight" },
      { label:"Run", action:"ambush_run" }
    ],
    ambushP: p
  };
  state.context = { mode:"event", event: evt };
  addLog("event", evt.text, { key:"AMBUSH" });
}

function resolveAmbushTalk(){
  const evt = state.context.event;
  const mood = state.stats.mood/100;
  const p = clamp(0.30 + mood*0.18, 0.20, 0.55);
  if (chance(rng, p)){
    addLog("event", "Your voice is steady. Their eyes flick away. They decide it’s not worth it.", { key:"DE-ESCALATE" });
    addXP(10, "De-escalation");
    state.context = { mode:"travel" };
  }else{
    addLog("event", "They don’t care what you say.", { key:"FAIL" });
    // forced combat
    startCombat(spawnEnemy("raider"), { raiders:true });
  }
}

function resolveAmbushRun(){
  const base = 0.50 + state.skills.mods.fleeBonus;
  const energy = state.stats.energy/100;
  const over = Math.max(0, invWeight() - maxCarry());
  const pen = clamp(over/12, 0, 0.25);
  const p = clamp(base + energy*0.15 - pen, 0.20, 0.85);

  if (chance(rng, p)){
    addLog("event", "You sprint into the brush and keep going until your lungs burn.", { key:"ESCAPE" });
    applyStatDelta({ energy:-10, mood:-2 });
    addXP(6, "Escape");
    state.context = { mode:"travel" };
  }else{
    addLog("event", "A hand clamps your shoulder. You’re dragged back.", { key:"CAUGHT" });
    startCombat(spawnEnemy("raider"), { raiders:true });
  }
}

function resolveAmbushFight(){
  startCombat(spawnEnemy("raider"), { raiders:true });
}

// ---------- Combat ----------
function spawnEnemy(kind){
  // simple enemy bestiary
  const table = {
    runner: { name:"Runner", hp: 28, dmg:[4,8], hit:0.65, crit:0.08, type:"infected" },
    stalker:{ name:"Stalker", hp: 34, dmg:[5,9], hit:0.62, crit:0.10, type:"infected" },
    clicker:{ name:"Clicker", hp: 48, dmg:[7,12], hit:0.60, crit:0.12, type:"infected", armor:0.18 },
    lurker:{ name:"Lurker", hp: 30, dmg:[4,9], hit:0.60, crit:0.09, type:"infected" },
    raider: { name:"Raider", hp: 36, dmg:[5,10], hit:0.66, crit:0.10, type:"human", armor:0.06 }
  };
  const base = table[kind] || table.runner;
  const e = deepClone(base);
  e.kind = kind;
  e.id = uid("enemy");
  // slight scaling with level
  const lv = state.stats.level;
  e.hp = Math.floor(e.hp * (1 + (lv-1)*0.06));
  e.maxHp = e.hp;
  e.dmg = [ Math.floor(e.dmg[0]*(1+(lv-1)*0.05)), Math.floor(e.dmg[1]*(1+(lv-1)*0.05)) ];
  return e;
}

function startCombat(enemy, meta={}){
  state.context = {
    mode:"combat",
    enemy,
    meta,
    // for simple pacing; player goes first each round
    round: 1
  };
  addLog("combat", `<b>${escapeHtml(enemy.name)}</b> closes in. Your breath fogs in the air.`, { key:"COMBAT" });
}

function combatPlayerAttack(kind){
  const ctx = state.context;
  if (ctx.mode !== "combat") return;
  const enemy = ctx.enemy;
  // Aim/Shoot only makes sense with a firearm equipped.
  if (kind==="aim"){
    const wdef = equippedWeaponDef();
    if (!wdef || !wdef.weapon || wdef.weapon.kind!=="firearm"){
      toast("No ranged weapon equipped.");
      return;
    }
  }


  // costs
  if (kind==="heavy"){
    if (state.stats.energy < 6){ toast("Too exhausted for a heavy swing."); return; }
    applyStatDelta({ energy:-6 });
  }else if (kind==="quick"){
    applyStatDelta({ energy:-3 });
  }else if (kind==="aim"){
    if (state.stats.energy < 4){ toast("Too exhausted to steady your aim."); return; }
    applyStatDelta({ energy:-4 });
  }

  // weapon handling
  const wdef = equippedWeaponDef();
  let dmgMin=2, dmgMax=5, crit=0.06, wepKind="unarmed";
  let usingFirearm = false;

  if (wdef){
    const ww = wdef.weapon;
    dmgMin = ww.dmg[0];
    dmgMax = ww.dmg[1];
    crit = ww.crit || crit;
    wepKind = ww.kind;
    usingFirearm = (ww.kind==="firearm");
    if (usingFirearm){
      // consume ammo
      const ammoId = ww.ammo;
      if (!hasItem(ammoId, 1)){
        addLog("combat", "Click. Empty. No ammo.", { key:"EMPTY" });
        // waste turn
        return enemyTurn();
      }
      removeItem(ammoId, 1);
    }
    if (ww.kind==="throwable"){
      // throwable consumes itself
      removeItem(wdef.id, 1);
      // if it was equipped, clear weapon
      if (state.inv.gear.weapon === wdef.id) state.inv.gear.weapon = "knife";
    }
  }

  // skill modifiers
  let dmgMult = 1.0;
  if (wepKind==="melee") dmgMult += state.skills.mods.meleeDmg;
  if (wepKind==="firearm") dmgMult += state.skills.mods.firearmDmg;

  // attack type modifiers
  if (kind==="heavy"){ dmgMult *= 1.22; }
  if (kind==="aim"){ crit += 0.06; }

  // execute bonus
  const hpPct = enemy.hp / enemy.maxHp;
  if (hpPct < 0.30) dmgMult *= (1 + state.skills.mods.execute);

  // hit chance
  let hit = 0.72;
  if (kind==="aim") hit += 0.10;
  if (state.stats.energy < 15) hit -= 0.06;

  // resolve
  if (!chance(rng, hit)){
    addLog("combat", "You swing—air. The world stutters.", { key:"MISS" });
    return enemyTurn();
  }

  let dmg = Math.floor( lerp(dmgMin, dmgMax, rng()) * dmgMult );

  // armor
  const armor = enemy.armor || 0;
  dmg = Math.max(1, Math.floor(dmg * (1 - armor)));

  // crit
  const critChance = clamp(crit + state.skills.mods.critBonus, 0, 0.45);
  if (chance(rng, critChance)){
    dmg = Math.floor(dmg * 1.6);
    addLog("combat", `<b>Critical!</b> You land a brutal hit for <b>${dmg}</b>.`, { key:"CRIT" });
  }else{
    addLog("combat", `You hit for <b>${dmg}</b>.`, { key:"HIT" });
  }

  enemy.hp -= dmg;

  // stun chance (small)
  let stunned = false;
  const stunP = clamp(0.05 + state.skills.mods.stunBonus + (kind==="heavy"?0.04:0), 0, 0.25);
  if (chance(rng, stunP)){
    stunned = true;
    addLog("combat", `${escapeHtml(enemy.name)} staggers — <em>stunned</em>.`, { key:"STUN" });
  }

  if (enemy.hp <= 0){
    enemy.hp = 0;
    return endCombat(true);
  }

  if (stunned){
    // skip enemy turn
    ctx.round += 1;
    refreshAll();
    return;
  }

  enemyTurn();
}

function combatUseItem(itemId){
  const def = CONTENT.items.defs[itemId];
  if (!def) return;
  if (!hasItem(itemId, 1)){ toast("You don't have that."); return; }
  if (def.type !== "consumable" && def.type !== "medical" && !(def.weapon && def.weapon.kind==="throwable")){
    toast("Can't use that now."); return;
  }

  // using takes time
  advanceMinutes(2, "combat");
  removeItem(itemId, 1);

  if (def.useText){
    addLog("combat", escapeHtml(def.useText), { key:"USE" });
  }

  // apply effects
  if (def.effects) applyStatDelta(def.effects);

  // specials
  if (def.specials){
    for (const s of def.specials) resolveMedicalSpecial(s);
  }

  // if throwable, treat like attack (quick)
  if (def.weapon && def.weapon.kind==="throwable"){
    // temporarily equip for handling; then attack
    const prev = state.inv.gear.weapon;
    state.inv.gear.weapon = itemId;
    combatPlayerAttack("quick");
    state.inv.gear.weapon = prev;
    refreshAll();
    return;
  }

  // enemy responds
  enemyTurn();
}

function combatFlee(){
  const ctx = state.context;
  if (ctx.mode !== "combat") return;

  const base = 0.45 + state.skills.mods.fleeBonus;
  const energy = state.stats.energy/100;
  const p = clamp(base + energy*0.20, 0.15, 0.85);

  applyStatDelta({ energy:-7, mood:-2 });
  addLog("combat", "You break away, trying to vanish into terrain.", { key:"FLEE" });

  if (chance(rng, p)){
    addLog("combat", "You escape. Your heart doesn't slow for a long time.", { key:"ESCAPE" });
    state.context = { mode:"travel" };
    addXP(5, "Escape");
    refreshAll();
  }else{
    addLog("combat", "It stays on you.", { key:"FAIL" });
    enemyTurn();
  }
}

function enemyTurn(){
  const ctx = state.context;
  if (ctx.mode !== "combat") return;
  const enemy = ctx.enemy;

  // enemy attacks
  advanceMinutes(3, "combat");
  const hit = enemy.hit || 0.62;
  if (!chance(rng, hit)){
    addLog("combat", `${escapeHtml(enemy.name)} lunges and misses.`, { key:"E-MISS" });
    ctx.round += 1;
    refreshAll();
    return;
  }

  let dmg = Math.floor( lerp(enemy.dmg[0], enemy.dmg[1], rng()) );
  let crit = enemy.crit || 0.08;
  if (chance(rng, crit)){
    dmg = Math.floor(dmg * 1.55);
    addLog("combat", `${escapeHtml(enemy.name)} lands a <b>critical</b> hit for <b>${dmg}</b>.`, { key:"E-CRIT" });
  }else{
    addLog("combat", `${escapeHtml(enemy.name)} hits you for <b>${dmg}</b>.`, { key:"E-HIT" });
  }
  // armor mitigation from equipped gear
  const gs = gearStats();
  const mit = clamp(gs.armor || 0, 0, 0.35);
  if (mit > 0){
    const reduced = Math.floor(dmg * mit);
    if (reduced > 0){
      dmg = Math.max(1, dmg - reduced);
      addLog("combat", `Your gear absorbs <b>${reduced}</b>.`, { key:"ARMOR" }, true);
    }
  }

  applyStatDelta({ health:-dmg, mood:-2 });

  // chance of injury
  const injP = clamp(0.22 + (enemy.type==="human"?0.05:0) + (isNight()?0.04:0), 0.10, 0.55);
  if (chance(rng, injP)){
    const part = pickWeighted(rng, [
      { w:6, v:"Head" },
      { w:34, v:"Torso" },
      { w:15, v:"Left Arm" },
      { w:15, v:"Right Arm" },
      { w:15, v:"Left Leg" },
      { w:15, v:"Right Leg" },
    ]);
    const sev = pickWeighted(rng, [ {w:70,v:1},{w:25,v:2},{w:5,v:3} ]);
    const bleed = (enemy.type==="human") ? pickWeighted(rng, [ {w:55,v:0},{w:35,v:1},{w:10,v:2} ]) : pickWeighted(rng, [ {w:65,v:0},{w:30,v:1},{w:5,v:2} ]);
    const inf = (enemy.type==="infected" && chance(rng, 0.25)) ? 1 : 0;

    addInjury({
      name: sev===1 ? "Laceration" : (sev===2 ? "Deep Cut" : "Crushed Wound"),
      part,
      severity: sev,
      bleeding: bleed,
      infected: inf,
      pain: sev,
      desc: inf ? "It burns. Infection risk." : "Stings and throbs."
    });
  }

  if (state.stats.health <= 0){
    refreshAll();
    return;
  }

  ctx.round += 1;
  refreshAll();
}

function endCombat(victory){
  const ctx = state.context;
  const enemy = ctx.enemy;
  if (victory){
    addLog("combat", `${escapeHtml(enemy.name)} collapses. The world goes quiet again.`, { key:"WIN" });
    // loot chance
    if (enemy.type==="human" && chance(rng, 0.45)){
      const loot = pickWeighted(rng, [
        { w:30, v:{ id:"water", q:[1,1]} },
        { w:25, v:{ id:"ammo_9mm", q:[3,10]} },
        { w:20, v:{ id:"bandage", q:[1,2]} },
        { w:15, v:{ id:"energy_bar", q:[1,2]} },
        { w:10, v:{ id:"painkillers", q:[1,1]} },
        { w:4, v:{ id:"tactical_pack", q:[1,1]} }
      ]);
      gainLoot([loot], "Looted raider");
    }
    // XP
    const xp = enemy.kind==="clicker" ? 30 : (enemy.kind==="stalker" ? 22 : (enemy.kind==="runner" ? 18 : 16));
    addXP(xp, enemy.type==="infected" ? "Infected" : "Survived");
    // mood bump
    applyStatDelta({ mood:+2 });

    // return to previous context if from location
    if (ctx.meta && ctx.meta.from==="location" && state.context.mode==="combat"){
      // If we have a location pending, go back to location exploration
      // If not, travel.
    }
  }else{
    addLog("combat", "You break. You run.", { key:"LOSE" });
  }

  // After combat, choose where you are
  let backToLoc = null;
  // If we were fighting because we entered a location event, try to return to that location
  if (ctx.meta && ctx.meta.locId){
    backToLoc = ctx.meta.locId;
  }

  if (backToLoc && state.discovered.locations[backToLoc] && !state.discovered.locations[backToLoc].left){
    state.context = { mode:"location", locId: backToLoc, areaId: state.discovered.locations[backToLoc].areas[0]?.id || null };
    addLog("location", "You listen. The building feels… less alive now.", { key:"AFTERMATH" }, true);
  }else{
    state.context = { mode:"travel" };
  }

  refreshAll();
}

// ---------- Location Exploration ----------
function currentLocation(){
  const ctx = state.context;
  if (ctx.mode !== "location") return null;
  return state.discovered.locations[ctx.locId] || null;
}
function currentArea(loc){
  const ctx = state.context;
  if (!loc) return null;
  return loc.areas.find(a=>a.id===ctx.areaId) || loc.areas[0] || null;
}

function searchArea(){
  const loc = currentLocation();
  if (!loc) return;
  const area = currentArea(loc);
  if (!area) return;
  if (area.searched){
    toast("Already searched.");
    return;
  }

  // costs
  const mins = Math.floor(lerp(18, 34, rng()));
  advanceMinutes(mins, "search");
  applyStatDelta({ energy:-Math.floor(lerp(2,5,rng())), mood:-1 });
  addXP(Math.floor(4 + mins/15), "Scavenge");

  // danger chance
  const threat = calcThreat();
  const noise = 0.12 * state.skills.mods.searchNoiseMult;
  const danger = clamp(0.10 + threat*0.25, 0.08, 0.42) * state.skills.mods.searchDangerMult;

  // results
  const lootRows = rollLoot(area.loot, 1 + state.skills.mods.lootBonus);
  area.searched = true;

  addLog("location", `<b>${escapeHtml(area.name)}</b>: ${escapeHtml(area.desc)}`, { key:"SEARCH" });
  gainLoot(lootRows, `Found in ${area.name}`);

  // possible events after search
  if (chance(rng, danger)){
    const which = pickWeighted(rng, [
      { w:55, v:"infected" },
      { w:30, v:"hazard" },
      { w:15, v:"nothing" }
    ]);
    if (which==="infected"){
      addLog("event", "A rasping breath answers your movement.", { key:"ALERT" });
      startCombat(spawnEnemy(pickWeighted(rng, [
        { w:70, v:"runner" },
        { w:25, v:"stalker" },
        { w:5, v:"clicker" },
      ])), { from:"location", locId: loc.id });
      return;
    }
    if (which==="hazard"){
      resolveSearchHazard();
    }
  }else if (chance(rng, noise)){
    addLog("location", "Something hears you. You hold your breath for a long time.", { key:"NOISE" });
  }

  refreshAll();
}

function resolveSearchHazard(){
  const h = pickWeighted(rng, [
    { w:35, v:"shard" },
    { w:30, v:"mold" },
    { w:20, v:"collapse" },
    { w:15, v:"rat" }
  ]);
  if (h==="shard"){
    addLog("location", "Your palm slides across broken glass.", { key:"HAZARD" });
    applyStatDelta({ health:-6, mood:-3 });
    addInjury({ name:"Cut Hand", part:"Left Arm", severity:1, bleeding:1, infected:0, pain:1, desc:"Bleeding. Harder to grip." });
  }else if (h==="mold"){
    addLog("location", "A wet breath of mold fills your lungs.", { key:"HAZARD" });
    applyStatDelta({ mood:-4, energy:-4, health:-2 });
  }else if (h==="collapse"){
    addLog("location", "A floorboard snaps. You slam down hard.", { key:"HAZARD" });
    applyStatDelta({ health:-10, energy:-6, mood:-6 });
    addInjury({ name:"Bruised Ribs", part:"Torso", severity:2, bleeding:0, infected:0, pain:2, desc:"Breathing hurts." });
  }else{
    addLog("location", "A rat bites and vanishes.", { key:"HAZARD" });
    applyStatDelta({ health:-3, mood:-2 });
    if (chance(rng, 0.25)){
      addInjury({ name:"Bite", part:"Left Arm", severity:1, bleeding:0, infected:1, pain:1, desc:"Swelling. Infection risk." });
    }
  }
}

// ---------- Loot ----------
function rollLoot(tableId, bonusMult=1.0){
  const table = CONTENT.lootTables[tableId] || [];
  if (table.length === 0) return [];
  const count = pickWeighted(rng, [
    { w:45, v:1 },
    { w:35, v:2 },
    { w:20, v:3 }
  ]);
  const out = [];
  for (let i=0;i<count;i++){
    const roll = pickWeighted(rng, table.map(e=>({ w:e.w, v:e.v })));
    out.push(roll);
  }

  // loot bonus: chance for one extra item
  if (chance(rng, clamp(0.15 * bonusMult, 0.0, 0.38))){
    const roll = pickWeighted(rng, table.map(e=>({ w:e.w, v:e.v })));
    out.push(roll);
  }

  return out;
}

function gainLoot(rows, reason="Loot"){
  if (!rows || rows.length===0){
    addLog("system", "Nothing useful.", { key:"LOOT" }, true);
    return;
  }
  ensureStackIds();
  let gained = [];
  let left = [];

  for (const r of rows){
    const def = CONTENT.items.defs[r.id];
    if (!def) continue;
    const q = (Array.isArray(r.q) ? Math.floor(lerp(r.q[0], r.q[1]+1, rng())) : (r.q || 1));

    // Try add (slot-limited). If it doesn't fit, leave it behind.
    const beforeW = invWeight();
    const ok = tryAddItem(r.id, q).ok;
    const afterW = invWeight();

    if (ok){
      gained.push(`${escapeHtml(def.name)} <span class="k">x${q}</span>`);
      if (afterW > maxCarry() && beforeW <= maxCarry()){
        addLog("system", "<b>Over weight capacity.</b> You can carry it, but travel will cost extra energy.", { key:"PACK" });
      }
    }else{
      left.push(`${escapeHtml(def.name)} <span class="k">x${q}</span>`);
    }
  }

  if (gained.length){
    addLog("system", `You collect: ${gained.join(", ")}.`, { key:"LOOT" });
  }else{
    addLog("system", "You can't carry any of it.", { key:"LOOT" });
  }

  if (left.length){
    addLog("system", `<b>No space.</b> Left behind: ${left.join(", ")}.`, { key:"SLOTS" });
  }
}

function openCraftingModal(){

  document.getElementById("craftModal").classList.add("show");

function closeCraftingModal(){

}
function getRecipeById(id){
  return (CONTENT.crafting.recipes || []).find(r=>r.id===id) || null;
}
function countItem(id){
  return state.inv.items.filter(x=>x.id===id).reduce((s,i)=>s+i.q,0);
}
function canCraft(recipe, times=1){
  if (!recipe) return { ok:false, why:"Missing recipe." };
  if (!state.skills.flags.crafting) return { ok:false, why:"Crafting locked." };
  if (state.context.mode !== "camp") return { ok:false, why:"Craft at camp." };

  if (recipe.tools){
    for (const t of recipe.tools){
      if (!hasItem(t,1)) return { ok:false, why:"Missing tool: " + (CONTENT.items.defs[t]?.name || t) };
    }
  }
  for (const r of (recipe.req||[])){
    if (!hasItem(r.id, r.q*times)) return { ok:false, why:"Missing: " + (CONTENT.items.defs[r.id]?.name||r.id) };
  }
  return { ok:true };
}
function maxCraftTimes(recipe){
  if (!recipe) return 0;
  let n = Infinity;
  for (const r of (recipe.req||[])){
    const have = countItem(r.id);
    n = Math.min(n, Math.floor(have / r.q));
  }
  if (!isFinite(n)) n = 0;
  if (recipe.tools){
    for (const t of recipe.tools){
      if (!hasItem(t,1)) return 0;
    }
  }
  return Math.max(0, n);
}
function simulateCraftOnce(recipe){
  ensureStackIds();
  const items = state.inv.items.map(x=>({ id:x.id, q:x.q, sid:x.sid }));

  // consume
  for (const r of (recipe.req||[])){
    let remain = r.q;
    for (let i=items.length-1;i>=0;i--){
      const it = items[i];
      if (it.id!==r.id) continue;
      const take = Math.min(it.q, remain);
      it.q -= take;
      remain -= take;
      if (it.q<=0) items.splice(i,1);
      if (remain<=0) break;
    }
    if (remain>0) return { ok:false, reason:"materials" };
  }

  // outputs (worst-case: include bonus +1)
  const outs = (recipe.out||[]).map(o=>({ id:o.id, q:o.q }));
  if (recipe.bonus && recipe.bonus.type==="countChance"){
    outs.push({ id: recipe.bonus.item, q: 1 });
  }

  for (const o of outs){
    const def = CONTENT.items.defs[o.id];
    if (!def) continue;
    const stack = def.stack || 1;
    let remaining = o.q;

    for (const it of items){
      if (it.id !== o.id) continue;
      const can = Math.max(0, stack - it.q);
      const take = Math.min(can, remaining);
      it.q += take;
      remaining -= take;
      if (remaining<=0) break;
    }
    while (remaining>0){
      const take = Math.min(stack, remaining);
      items.push({ id:o.id, q:take, sid: uid("stk") });
      remaining -= take;
    }
  }

  const res = packInventory(items);
  if (!res.ok) return { ok:false, reason:"slots" };
  return { ok:true };
}
function craftRecipe(recipeId, times=1){
  const recipe = getRecipeById(recipeId);
  if (!recipe) return;

  let crafted = 0;
  const maxT = maxCraftTimes(recipe);
  times = Math.min(times, maxT);

  if (times <= 0){
    toast("You can't craft that right now.");
    return;
  }

  for (let i=0;i<times;i++){
    const chk = canCraft(recipe, 1);
    if (!chk.ok) break;

    const sim = simulateCraftOnce(recipe);
    if (!sim.ok){
      if (sim.reason==="slots") toast("No inventory space for the result.");
      break;
    }

    // consume ingredients
    for (const r of (recipe.req||[])) removeItem(r.id, r.q);

    // base outputs
    for (const o of (recipe.out||[])){
      if (!tryAddItem(o.id, o.q).ok){
        for (const r of (recipe.req||[])) addItem(r.id, r.q);
        toast("No space for crafted item.");
        return;
      }
    }

    // bonus roll
    if (recipe.bonus && recipe.bonus.type==="countChance"){
      const bonus = 1 + (state.skills.mods.craftBonus||0);
      const p = clamp(recipe.bonus.chanceBase * bonus, 0.15, 0.75);
      if (chance(rng, p)){
        tryAddItem(recipe.bonus.item, 1);
      }
    }

    // time & XP
    if (recipe.time) advanceMinutes(Math.floor(lerp(recipe.time[0], recipe.time[1]+1, rng())), "camp");
    if (recipe.xp) addXP(recipe.xp, "Craft");

    crafted++;
  }

  if (crafted>0){
    addLog("system", `Crafted <b>${crafted}</b> × ${escapeHtml(recipe.name)}.`, { key:"CRAFT" });
  }

  refreshAll();
  refreshCraftingModal();
}

      refreshCraftingModal();
    });

  const r = getRecipeById(st.sel);
  if (!r){
    detail.innerHTML = `<div class="meta">Select a recipe.</div>`;

    `${CONTENT.items.defs[x.id]?.name||x.id} x${x.q} <span class="muted">(you have ${countItem(x.id)})</span>`
  ).join("<br>");

  const outText = (r.out||[]).map(o=>`${CONTENT.items.defs[o.id]?.name||o.id} x${o.q}`).join("<br>");
  const toolText = (r.tools||[]).map(t=>`${CONTENT.items.defs[t]?.name||t}`).join(", ");

    <div class="nm">${escapeHtml(r.name)} <span class="k">${escapeHtml(r.id)}</span></div>
    <div class="meta">${escapeHtml(r.desc||"")}</div>

    <div class="kv"><span>Time</span><b>${r.time?`${r.time[0]}–${r.time[1]} min`:"—"}</b></div>

    <div class="kv"><span>Space</span><b>${spaceOk ? "OK" : "No room"}</b></div>

    <div class="divider"></div>

    <div class="craftBtns">
      <button class="primary" id="btnCraft1" ${(!chk.ok||mx<=0||!spaceOk)?"disabled":""}>Craft 1</button>
      <button id="btnCraft5" ${(!chk.ok||mx<5||!spaceOk)?"disabled":""}>Craft 5</button>
      <button id="btnCraftMax" ${(!chk.ok||mx<=0||!spaceOk)?"disabled":""}>Craft Max (${mx})</button>

// ---------- Actions Router ----------
function doAction(action, payload){
  // universal actions
  if (action==="travel") return travel();
  if (action==="open_camp") return openCamp();
  if (action==="rest_short") return rest("short");
  if (action==="rest_sleep") return rest("sleep");
  if (action==="make_fire") return makeFire();
  if (action==="craft_menu") return craftMenu();
  if (action==="new_game") return newGame();

  // event context actions
  const ctx = state.context;
  if (ctx.mode==="event"){
    if (action==="enter_location") return enterLocation(payload.locId);
    if (action==="avoid_location") return avoidLocation(payload.locId);
    if (action==="tracks_follow") return tracksFollow();
    if (action==="tracks_avoid") return tracksAvoid();
    if (action==="leave_location_soft") return leaveLocation(payload.locId || ctx.event.locId, true);
    if (action==="flee_from_location") return fleeFromLocation(payload.locId || ctx.event.locId);
    if (action==="start_combat_lurker") return startCombat(spawnEnemy("lurker"), { from:"location", locId: payload.locId || ctx.event.locId });
    if (action==="start_combat_runner") return startCombat(spawnEnemy("runner"), { from:"location", locId: payload.locId || ctx.event.locId });
    if (action==="distract") return distract(payload.locId || ctx.event.locId);
    if (action==="ambush_talk") return resolveAmbushTalk();
    if (action==="ambush_fight") return resolveAmbushFight();
    if (action==="ambush_run") return resolveAmbushRun();

    if (action==="craft_bandage") return craftBandage();
    if (action==="craft_antiseptic") return craftAntiseptic();
    if (action==="craft_medkit") return craftMedkit();
    if (action==="camp_back") { state.context = { mode:"camp" }; refreshAll(); return; }

    // quick trade actions that consume items
    if (action==="trade_water_ammo"){
      if (!hasItem("water",1)) return toast("No water to trade.");
      removeItem("water",1);
      runEventAction(action, payload);
      return;
    }
    if (action==="trade_jerky_bandage"){
      if (!hasItem("jerky",1)) return toast("No jerky to trade.");
      removeItem("jerky",1);
      runEventAction(action, payload);
      return;
    }

    // data-driven actions (events/locations)
    if (runEventAction(action, payload)) return;

    // if unknown, fall back
    state.context = { mode:"travel" };
    refreshAll();
    return;
  }

  // location context actions
  if (ctx.mode==="location"){
    const loc = currentLocation();
    if (!loc) return;
    if (action==="set_area") {
      ctx.areaId = payload.areaId;
      if (payload && payload.autoSearch) return searchArea();
      const _area = currentArea(loc);
      if (_area) addLog("location", `<b>${escapeHtml(_area.name)}</b> — ${escapeHtml(_area.desc)}`, { key:"AREA" }, true);
      refreshAll();
      return;
    }
    if (action==="search_area") return searchArea();
    if (action==="leave_location") return leaveLocation(loc.id, false);
  }

  // combat context actions
  if (ctx.mode==="combat"){
    if (action==="atk_quick") return combatPlayerAttack("quick");
    if (action==="atk_heavy") return combatPlayerAttack("heavy");
    if (action==="atk_aim") return combatPlayerAttack("aim");
    if (action==="flee") return combatFlee();
    if (action==="use_item") return combatUseItem(payload.itemId);
  }

  // camp context actions
  if (ctx.mode==="camp"){
    if (action==="back_to_travel"){ state.context={mode:"travel"}; refreshAll(); return; }
  }
}

    gainLoot([

    ], "Stash");

    } };

  }else{
