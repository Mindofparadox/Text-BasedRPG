    ${statBar100("Dampness", s.dampness, dampMode)}
    ${statBar100("Mood", s.mood, moodMode)}
    ${statBar("XP", s.xp, xpNeed, xpMode, ` • Lv ${s.level}`)}
    <div class="minirow">
      <div class="chip"><span class="tag">SP</span> <b>${s.skillPoints}</b></div>
      <div class="chip"><span class="tag">CARRY</span> <b>${invWeight().toFixed(1)}</b> / ${maxCarry().toFixed(1)}</div>
      <div class="chip"><span class="tag">SLOTS</span> <b>${(state.inv.grid?state.inv.grid.usedCells:0)}</b> / ${(state.inv.grid?state.inv.grid.totalCells:0)}</div>
      <div class="chip"><span class="tag">BIOME</span> <b>${currentBiome().name}</b></div>
      <div class="chip"><span class="tag">SEED</span> <b>${state.seed}</b></div>
    </div>
  `;
  document.getElementById("statsPanel").innerHTML = html;
}

function refreshActions(){
  const el = document.getElementById("actions");
  el.innerHTML = "";
  const ctx = state.context;

  function addBtn(label, action, cls=""){
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", ()=>doAction(action, {}));
    el.appendChild(b);
    return b;
  }
  function addBtnPayload(label, action, payload, cls=""){
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", ()=>doAction(action, payload));
    el.appendChild(b);
    return b;
  }

  if (ctx.mode === "travel"){
    addBtn("Travel (Pass Time)", "travel", "primary");
    addBtn("Make Camp", "open_camp");
    addBtn("Short Rest (1h)", "rest_short");
    addBtn("Sleep (8h)", "rest_sleep");
    return;
  }

  if (ctx.mode === "camp"){
    addBtn("Travel (Leave Camp)", "back_to_travel", "primary");
    addBtn("Make Fire (needs Lighter)", "make_fire");
    addBtn("Short Rest (1h)", "rest_short");
    addBtn("Sleep (8h)", "rest_sleep");
    addBtn("Craft", "craft_menu");
    return;
  }

  if (ctx.mode === "event"){
    const evt = ctx.event;
    // buttons from event options
    (evt.options||[]).forEach(opt=>{
      addBtnPayload(opt.label, opt.action, opt, opt.action.includes("fight") ? "danger" : (opt.action.includes("enter") ? "primary" : ""));
    });
    // also allow camping from events only if safe-ish
    if (evt.title !== "Ambush" && evt.title !== "Sudden Screech"){
      addBtn("Make Camp", "open_camp");
    }
    return;
  }

  if (ctx.mode === "location"){
    const loc = currentLocation();
    const area = currentArea(loc);
    if (!loc){
      state.context = { mode:"travel" };
      return refreshAll();
    }
    // area selector buttons
    for (const a of loc.areas){
      const lbl = a.searched ? `${a.name} ✓` : a.name;
      addBtnPayload(lbl, "set_area", { areaId: a.id, autoSearch: true }, a.id===ctx.areaId ? "primary" : "");
    }
    addBtn(area && area.searched ? "Search (Already)" : "Search Area", "search_area", area && area.searched ? "ghost" : "");
    addBtn("Leave Location", "leave_location");
    return;
  }

  if (ctx.mode === "combat"){
    addBtn("Quick Attack", "atk_quick", "primary");
    addBtn("Heavy Attack", "atk_heavy");
    const wdef = equippedWeaponDef();
    if (wdef && wdef.weapon && wdef.weapon.kind==="firearm"){
      addBtn("Aim / Shoot", "atk_aim");
    }
    addBtn("Flee", "flee", "danger");

    // quick-use medical
    const usable = state.inv.items
      .map(x=>x.id)
      .filter((id, idx, arr)=>arr.indexOf(id)===idx)
      .filter(id=>{
        const def = CONTENT.items.defs[id];
        if (!def) return false;
        if (def.type==="medical") return true;
        if (def.type==="consumable") return true;
        if (def.weapon && def.weapon.kind==="throwable") return true;
        return false;
      })
      .slice(0, 6);

    for (const id of usable){
      const def = CONTENT.items.defs[id];
      const b = document.createElement("button");
      b.textContent = "Use: " + def.name;
      b.className = "ghost";
      b.addEventListener("click", ()=>doAction("use_item", { itemId:id }));
      el.appendChild(b);
    }
    return;
  }
}

function refreshInventory(){
  const ctx = state.context;
  const tabBtns = [...document.querySelectorAll(".tabbtn")];
  let activeTab = tabBtns.find(b=>b.classList.contains("active"))?.dataset.tab || "inventory";

  // top summary
  const gear = state.inv.gear;
  const w = invWeight();
  const cap = maxCarry();
  const carryCls = w > cap ? "pill danger" : (w > cap*0.85 ? "pill warn" : "pill");

  const enemy = (ctx.mode==="combat") ? ctx.enemy : null;

  let top = `
    <div class="minirow">
      <div class="pill ${carryCls}" style="padding:7px 10px"><span class="dot"></span><span><b>Carry</b> ${w.toFixed(1)} / ${cap.toFixed(1)}</span></div>
      <div class="pill" style="padding:7px 10px"><span class="dot"></span><span><b>Weapon</b> ${escapeHtml((CONTENT.items.defs[gear.weapon]||{name:"None"}).name)}</span></div>
      <div class="pill" style="padding:7px 10px"><span class="dot"></span><span><b>Back</b> ${escapeHtml((gear.back && CONTENT.items.defs[gear.back] ? CONTENT.items.defs[gear.back].name : "Empty"))}</span></div>
    </div>
  `;
  if (enemy){
    top += `
      <div class="divider"></div>
      <div class="kv"><span>Enemy</span><b>${escapeHtml(enemy.name)} • ${enemy.hp}/${enemy.maxHp}</b></div>
      <div class="bar ${enemy.hp/enemy.maxHp < 0.30 ? "danger" : (enemy.hp/enemy.maxHp < 0.55 ? "warn" : "")}"><i style="width:${Math.floor((enemy.hp/enemy.maxHp)*100)}%"></i></div>
    `;
  }
  document.getElementById("invTop").innerHTML = top;

  // list
  const list = document.getElementById("invList");
  list.innerHTML = "";

  if (activeTab==="inventory"){
    // sort by type then name
    const rows = state.inv.items.map(it=>{
      const def = CONTENT.items.defs[it.id];
      return { ...it, def, type: def?.type||"misc", name: def?.name||it.id, weight: (def?.weight||0) };
    }).sort((a,b)=> (a.type.localeCompare(b.type) || a.name.localeCompare(b.name)));


    // Grid view (slot-based)
    repackInventory();
    const grid = state.inv.grid || {};
    const gridCard = document.createElement("div");
    gridCard.className = "gridInvCard";
    const used = grid.usedCells || 0;
    const total = grid.totalCells || 0;
    gridCard.innerHTML = `
      <div class="gridHdr">
        <span><b>Inventory Grid</b> • Slots <b>${used}</b> / ${total}</span>
        <span class="tag">${grid.w || 0}×${grid.h || 0}</span>
      </div>
      <div class="invGrid" style="--cols:${grid.w||6}; --rows:${grid.h||4};"></div>
      <div class="meta">Tip: Bigger packs increase grid space (slots). Weight is separate.</div>
    `;
    list.appendChild(gridCard);

    const gridEl = gridCard.querySelector(".invGrid");
    // Background cells (visual only)
    const cells = (grid.w||6) * (grid.h||4);
    for (let i=0;i<cells;i++){
      const c = document.createElement("div");
      c.className = "invCell";
      gridEl.appendChild(c);
    }

    // Tiles
    const placements = (grid.placements || []);
    for (const p of placements){
      const def = CONTENT.items.defs[p.id];
      const tile = document.createElement("div");
      const selected = (state.ui && state.ui.selectedInvSid===p.sid);
      tile.className = "invTile" + (selected ? " sel" : "");
      tile.style.gridColumn = (p.x+1) + " / span " + p.w;
      tile.style.gridRow = (p.y+1) + " / span " + p.h;
      tile.innerHTML = `<div class="nm">${escapeHtml(def?def.name:p.id)}</div><div class="sm">x${p.q}</div>`;
      tile.addEventListener("click", ()=>{
        state.ui.selectedInvSid = p.sid;
        refreshInventory();
      });
      gridEl.appendChild(tile);
    }

    // Overflow warning (shouldn't happen in normal play because we block adding/equipping)
    if (grid.overflow && grid.overflow.length){
      addLog("system", "<b>Inventory overflow.</b> Some items don’t fit. Drop items or equip a bigger pack.", { key:"SLOTS" });
    }

    if (rows.length===0){
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="nm">Empty</div><div class="meta">Your pack is lighter than your thoughts.</div>`;
      list.appendChild(d);
      return;
    }

    for (const it of rows){
      if (!it.def) continue;
      const def = it.def;
      const tags = (def.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(" ");

      const div = document.createElement("div");
      const isSel = (state.ui && state.ui.selectedInvSid===it.sid);
      div.className = "item" + (isSel ? " sel" : "");
      const canUse = (def.type==="consumable" || def.type==="medical" || (def.weapon && def.weapon.kind==="throwable"));
      const slot = getEquipSlotForItem(def);
      const canEquipAny = !!slot;
      const isEquipped = (slot && state.inv.gear && state.inv.gear[slot]===it.id);

      div.innerHTML = `
        <div class="top">
          <div>
            <div class="nm">${escapeHtml(def.name)} <span class="k">x${it.q}</span></div>
            <div class="meta">${tags} <span>•</span> <span>${escapeHtml(def.type)}</span> <span>•</span> <span>${(def.weight||0).toFixed(1)} wt</span> <span>•</span> <span class="tag">${(()=>{ const s=getItemSize(def); return s.w+"x"+s.h; })()}</span></div>
          </div>
        </div>
        <div class="btns">
          ${canUse ? `<button class="ghost" data-act="use">Use</button>` : ``}
          ${canEquipAny ? `<button class="ghost" data-act="equip">${isEquipped?"Unequip":"Equip"} <span class="k">${escapeHtml(slot)}</span></button>` : ``}
          <button class="ghost" data-act="drop">Drop</button>
        </div>
      `;

      div.querySelectorAll("button").forEach(b=>{
        const act = b.dataset.act;
        b.addEventListener("click", ()=>{
          if (act==="use") useItem(it.id);
          if (act==="equip") equipItem(it.id);
          if (act==="drop") dropItem(it.id);
        });
      });

      list.appendChild(div);
    }
    return;
  }

  if (activeTab==="gear"){
    const gear = state.inv.gear || {};
    const gstats = gearStats();
    const sel = state.ui.selectedEquipSlot || "weapon";

    // Slots grid
    const slotBox = document.createElement("div");
    slotBox.className = "item";
    slotBox.innerHTML = `
      <div class="nm">Equipment</div>
      <div class="meta">Click a slot to manage what you’re wearing/carrying.</div>
      <div class="divider"></div>
      <div class="equipGrid">
        ${EQUIP_SLOTS.map(s=>{
          const id = gear[s.id];
          const def = id ? CONTENT.items.defs[id] : null;
          const name = def ? def.name : "Empty";
          const cls = (sel===s.id) ? "slotCard sel" : "slotCard";
          const tags = [];
          const g = def ? (def.clothing || def.gear || {}) : {};
          if (s.id==="back" && (g.carry||0)>0) tags.push(`+${g.carry} carry`);
          if ((g.armor||0)>0) tags.push(`${Math.round(g.armor*100)}% armor`);
          if ((g.warmth||0)>0) tags.push(`+${g.warmth} warmth`);
          if ((g.waterproof||0)>0) tags.push(`+${g.waterproof} waterproof`);
          if ((g.travelBonus||0)>0) tags.push(`${Math.round(g.travelBonus*100)}% travel`);
          return `
            <div class="${cls}" data-slot="${escapeHtml(s.id)}">
              <div class="sl"><span>${escapeHtml(s.label)}</span><span class="tag">${escapeHtml(s.id)}</span></div>
              <div class="eq">${escapeHtml(name)}</div>
              <div class="sub">${tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(" ")}</div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="divider"></div>
      <div class="kv"><span>Armor Mitigation</span><b>${Math.round(clamp(gstats.armor,0,0.35)*100)}%</b></div>
      <div class="kv"><span>Carry Bonus (Back)</span><b>+${Math.floor(gstats.carry||0)}</b></div>
      <div class="kv"><span>Warmth / Waterproof</span><b>+${gstats.warmth} / +${gstats.waterproof}</b></div>
      <div class="kv"><span>Travel Bonus</span><b>${Math.round((gstats.travelBonus||0)*100)}%</b></div>
    `;
    list.appendChild(slotBox);

    // Hook clicks
    slotBox.querySelectorAll(".slotCard").forEach(card=>{
      card.addEventListener("click", ()=>{
        state.ui.selectedEquipSlot = card.dataset.slot;
        refreshInventory();
      });
    });

    // Manage selected slot
    const sInfo = EQUIP_SLOTS.find(x=>x.id===sel) || EQUIP_SLOTS[0];
    const curId = gear[sel];
    const curDef = curId ? CONTENT.items.defs[curId] : null;

    const manage = document.createElement("div");
    manage.className = "item";
    manage.innerHTML = `
      <div class="nm">Manage Slot: ${escapeHtml(sInfo.label)} <span class="k">${escapeHtml(sel)}</span></div>
      <div class="meta">Equipped: <b>${escapeHtml(curDef?curDef.name:"Empty")}</b></div>
      <div class="btns">
        ${curId ? `<button class="ghost" data-act="unequip">Unequip</button>` : ``}
      </div>
      <div class="divider"></div>
      <div class="meta">Eligible items in your pack:</div>
      <div class="slotList" id="eligibleList"></div>
    `;
    list.appendChild(manage);

    const eligible = [];
    const uniq = new Set();
    for (const it of state.inv.items){
      if (uniq.has(it.id)) continue;
      uniq.add(it.id);
      const def = CONTENT.items.defs[it.id];
      if (!def) continue;
      const slot = getEquipSlotForItem(def);
      if (slot !== sel) continue;
      eligible.push({ id: it.id, q: it.q, def });
    }

    const elist = manage.querySelector("#eligibleList");
    if (eligible.length===0){
      const msg = document.createElement("div");
      msg.className = "meta";
      msg.textContent = "No compatible items.";
      elist.appendChild(msg);
    }else{
      for (const e of eligible){
        const def = e.def;
        const g = def.clothing || def.gear || {};
        const meta = [];
        if (sel==="weapon" && def.weapon){
          meta.push(`DMG ${def.weapon.dmg[0]}–${def.weapon.dmg[1]}`);
          if (def.weapon.ammo) meta.push(`Ammo: ${CONTENT.items.defs[def.weapon.ammo]?.name || def.weapon.ammo}`);
        }
        if ((g.armor||0)>0) meta.push(`${Math.round(g.armor*100)}% armor`);
        if ((g.carry||0)>0) meta.push(`+${g.carry} carry`);
        if ((g.warmth||0)>0) meta.push(`+${g.warmth} warmth`);
        if ((g.waterproof||0)>0) meta.push(`+${g.waterproof} waterproof`);
        if ((g.travelBonus||0)>0) meta.push(`${Math.round(g.travelBonus*100)}% travel`);

        const row = document.createElement("div");
        row.className = "slotRow";
        row.innerHTML = `
          <div class="left">
            <div class="nm">${escapeHtml(def.name)} <span class="k">x${e.q}</span></div>
            <div class="meta">${meta.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(" ")}</div>
          </div>
          <button class="${(gear[sel]===e.id) ? "ghost" : "primary"}" data-act="equip">${(gear[sel]===e.id) ? "Equipped" : "Equip"}</button>
        `;
        row.querySelector("button").addEventListener("click", ()=>{
          equipItem(e.id);
          refreshInventory();
          refreshStats();
        });
        elist.appendChild(row);
      }
    }

    manage.querySelectorAll("button[data-act='unequip']").forEach(b=>{
      b.addEventListener("click", ()=>{
        unequipSlot(sel);
        refreshInventory();
        refreshStats();
      });
    });

    return;
  }

  if (activeTab==="status"){
    // Interactive body map + targeted treatment
    const selected = normalizePart((state.ui && state.ui.selectedBodyPart) ? state.ui.selectedBodyPart : "Torso");
    const selSum = partSummary(selected);

    const bodyCard = document.createElement("div");
    bodyCard.className = "item";

    const partButtons = [
      { part:"Head",      lbl:"HEAD",  x:70,  y:10,  w:60, h:44, r:999 },
      { part:"Torso",     lbl:"TORSO", x:58,  y:60,  w:84, h:92, r:16  },
      { part:"Left Arm",  lbl:"L ARM", x:14,  y:66,  w:38, h:92, r:14  },
      { part:"Right Arm", lbl:"R ARM", x:148, y:66,  w:38, h:92, r:14  },
      { part:"Left Leg",  lbl:"L LEG", x:72,  y:162, w:44, h:98, r:14  },
      { part:"Right Leg", lbl:"R LEG", x:116, y:162, w:44, h:98, r:14  },
    ];

    bodyCard.innerHTML = `
      <div class="nm">Body Status</div>
      <div class="meta">Click a body part to view wounds and apply medical supplies.</div>

      <div class="bodyWrap">
        <div class="silhouette">
          ${partButtons.map(p=>{
            const sum = partSummary(p.part);
            const cls = "bodyPart " + sum.level + (normalizePart(p.part)===selected ? " selected" : "");
            return `<button class="${cls}" data-part="${escapeHtml(p.part)}"
              style="left:${p.x}px; top:${p.y}px; width:${p.w}px; height:${p.h}px; border-radius:${p.r}px;">
              ${escapeHtml(p.lbl)}
            </button>`;
          }).join("")}
        </div>

        <div class="bodySide">
          <div class="kv"><span>Selected</span><b>${escapeHtml(selected)}</b></div>
          <div class="kv"><span>Wounds</span><b>${selSum.arr.length}</b></div>
          <div class="kv"><span>Bleeding</span><b>${selSum.bleed}</b></div>
          <div class="kv"><span>Infection</span><b>${selSum.inf}</b></div>
          <div class="kv"><span>Pain</span><b>${selSum.pain}</b></div>

          <div class="divider"></div>

          <div class="btns">
            <button class="ghost" data-med="bandage">Apply Bandage</button>
            <button class="ghost" data-med="antiseptic">Apply Antiseptic</button>
            <button class="ghost" data-med="painkillers">Take Painkillers</button>
            <button class="ghost" data-med="medkit">Use Medkit</button>
          </div>

          <div class="divider"></div>
          <div class="hint">
            Bandage reduces bleeding. Antiseptic reduces infection. Painkillers reduce pain (and help mood/energy).
            Medkit heals and treats that body part.
          </div>
        </div>
      </div>
    `;
    list.appendChild(bodyCard);

    // Hook up body part clicks
    bodyCard.querySelectorAll(".bodyPart").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.ui = state.ui || {};
        state.ui.selectedBodyPart = normalizePart(btn.dataset.part);
        refreshInventory();
      });
    });

    // Enable / disable med buttons based on inventory + needs
    const medButtons = [...bodyCard.querySelectorAll("button[data-med]")];
    for (const b of medButtons){
      const id = b.dataset.med;
      const wounds = injuriesForPart(selected);
      const bleed = wounds.reduce((s,i)=>s+(i.bleeding||0),0);
      const inf   = wounds.reduce((s,i)=>s+(i.infected||0),0);
      const pain  = wounds.reduce((s,i)=>s+(i.pain||0),0);

      let enabled = hasItem(id, 1);
      if (id==="bandage") enabled = enabled && (wounds.length>0) && (bleed>0);
      if (id==="antiseptic") enabled = enabled && (wounds.length>0) && (inf>0);
      if (id==="painkillers") enabled = enabled && (wounds.length>0) && (pain>0);
      if (id==="medkit") enabled = enabled && ((wounds.length>0) || (state.stats.health < state.stats.maxHealth));

      b.disabled = !enabled;
      b.addEventListener("click", ()=>applyMedicalToPart(id, selected));
    }

    // Wounds on selected part
    const wounds = injuriesForPart(selected);
    if (wounds.length===0){
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="nm">Wounds — ${escapeHtml(selected)}</div><div class="meta">No wounds on this body part.</div>`;
      list.appendChild(d);
    }else{
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="nm">Wounds — ${escapeHtml(selected)}</div><div class="meta">Treat with the buttons above. Wounds persist until managed.</div>`;
      list.appendChild(d);

      for (const i of wounds){
        const card = document.createElement("div");
        card.className = "item";
        const tags = [
          i.severity?`<span class="tag">SEV ${i.severity}</span>`:"",
          i.bleeding?`<span class="tag">BLEED ${i.bleeding}</span>`:"",
          i.infected?`<span class="tag">INF ${i.infected}</span>`:"",
          i.pain?`<span class="tag">PAIN ${i.pain}</span>`:""
        ].filter(Boolean).join(" ");
        card.innerHTML = `
          <div class="nm">${escapeHtml(i.name)} <span class="k">${escapeHtml(normalizePart(i.part))}</span></div>
          <div class="meta">${tags || `<span class="tag">STABLE</span>`}</div>
          <div class="meta">${escapeHtml(i.desc)}</div>
        `;
        list.appendChild(card);
      }
    }

    // All injuries overview (grouped)
    const all = state.injuries || [];
    const overview = document.createElement("div");
    overview.className = "item";
    const counts = BODY_PARTS.map(p=>{
      const sum = partSummary(p);
      if (sum.arr.length===0) return "";
      const tags = [
        sum.bleed?`<span class="tag">BLEED ${sum.bleed}</span>`:"",
        sum.inf?`<span class="tag">INF ${sum.inf}</span>`:"",
        sum.pain?`<span class="tag">PAIN ${sum.pain}</span>`:""
      ].filter(Boolean).join(" ");
      return `<div class="kv"><span>${escapeHtml(p)}</span><b>${sum.arr.length} ${tags?(" "+tags):""}</b></div>`;
    }).filter(Boolean).join("");

    overview.innerHTML = `
      <div class="nm">Wounds Overview</div>
      ${counts || `<div class="meta">No active injuries.</div>`}
    `;
    list.appendChild(overview);

    // Conditions summary
    const d2 = document.createElement("div");
    d2.className = "item";
    const w = currentWeather();
    d2.innerHTML = `
      <div class="nm">Conditions</div>
      <div class="kv"><span>Weather</span><b>${escapeHtml(w.name)} • ${escapeHtml(w.desc)}</b></div>
      <div class="kv"><span>Time</span><b>Day ${state.day} • ${fmtTime(state.minuteOfDay)} • ${phaseOfDay(state.minuteOfDay)}</b></div>
      <div class="kv"><span>Threat</span><b>${Math.round(calcThreat()*100)}%</b></div>
      <div class="meta">Weather and time affect temperature, dampness, and encounter risk.</div>
    `;
    list.appendChild(d2);
    return;
  }

  if (activeTab==="codex"){
    // Item Codex: helps you add new items by showing ids + stats + templates
    state.ui = state.ui || {};
    if (typeof state.ui.codexQuery !== "string") state.ui.codexQuery = "";

    const wrap = document.createElement("div");
    wrap.className = "item";
    wrap.innerHTML = `
      <div class="nm">Item Codex</div>
      <div class="meta">Search by name or id. Add new items in <span class="tag">CONTENT.items.defs</span>.</div>
      <div class="divider"></div>
      <div class="codexBar">
        <input id="codexSearch" placeholder="Search items (e.g., pistol, medkit, backpack_small)..." value="${escapeHtml(state.ui.codexQuery)}" />
        <button class="ghost" id="codexClear">Clear</button>
      </div>
      <div class="codexList" id="codexList"></div>
      <div class="divider"></div>
      <div class="nm">Templates</div>
      <div class="meta">Copy these and change ids/values. (Set <span class="tag">size:[w,h]</span> for special grid shapes.)</div>
      <div class="templateBox" id="tplBox"></div>
    `;
    list.appendChild(wrap);

    const input = wrap.querySelector("#codexSearch");
    const clear = wrap.querySelector("#codexClear");
    input.addEventListener("input", ()=>{
      state.ui.codexQuery = input.value || "";
      refreshInventory();
    });
    clear.addEventListener("click", ()=>{
      state.ui.codexQuery = "";
      refreshInventory();
    });

    const q = (state.ui.codexQuery || "").trim().toLowerCase();
    const defs = CONTENT.items.defs;
    const rows = Object.entries(defs)
      .map(([id, def])=>({ id, def }))
      .filter(x=>{
        if (!q) return true;
        return x.id.toLowerCase().includes(q) || (x.def.name||"").toLowerCase().includes(q) || (x.def.type||"").toLowerCase().includes(q);
      })
      .sort((a,b)=> (a.def.type||"").localeCompare(b.def.type||"") || (a.def.name||a.id).localeCompare(b.def.name||b.id))
      .slice(0, 120); // keep UI snappy

    const listEl = wrap.querySelector("#codexList");
    if (rows.length===0){
      const d = document.createElement("div");
      d.className = "meta";
      d.textContent = "No matches.";
      listEl.appendChild(d);
    }else{
      for (const r of rows){
        const def = r.def;
        const slot = def.equip && def.equip.slot ? def.equip.slot : "-";
        const sz = getItemSize(def);
        const g = def.clothing || def.gear || {};
        const tags = (def.tags||[]).slice(0,8).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(" ");
        const bonuses = [];
        if (g.gridW && g.gridH) bonuses.push(`${g.gridW}×${g.gridH} grid`);
        if (g.carry) bonuses.push(`+${g.carry} carry`);
        if (g.armor) bonuses.push(`${Math.round(g.armor*100)}% armor`);
        if (g.warmth) bonuses.push(`+${g.warmth} warmth`);
        if (g.waterproof) bonuses.push(`+${g.waterproof} waterproof`);
        if (g.travelBonus) bonuses.push(`${Math.round(g.travelBonus*100)}% travel`);
        const w = def.weapon;
        const wline = w ? `Weapon: ${w.kind} • DMG ${w.dmg[0]}–${w.dmg[1]} • crit ${(w.crit||0)*100|0}%${w.ammo?` • ammo ${w.ammo}`:""}` : "";

        const box = document.createElement("div");
        box.className = "codexItem";
        box.innerHTML = `
          <div class="top">
            <div>
              <div class="nm">${escapeHtml(def.name)} <span class="id">${escapeHtml(r.id)}</span></div>
              <div class="meta">${tags} <span>•</span> <span>${escapeHtml(def.type)}</span> <span>•</span> <span>${def.weight.toFixed(2)} wt</span> <span>•</span> <span class="tag">${sz.w}x${sz.h}</span> <span>•</span> <span class="tag">slot:${escapeHtml(slot)}</span> <span>•</span> <span class="tag">stack:${def.stack}</span></div>
            </div>
          </div>
          <div class="desc">${bonuses.length?("Bonuses: "+bonuses.join(", ")):""} ${wline?("<br>"+escapeHtml(wline)):""}</div>
        `;
        listEl.appendChild(box);
      }
    }

    const templates = [
`// FOOD (consumable)
trail_mix: {
  name:"Trail Mix",
  type:"consumable",
  weight:0.2,
  stack:8,
  tags:["food"],
  size:[1,1],
  useText:"Salty. Sweet. Enough.",
  effects:{ hunger:+16, mood:+1, energy:+2 }
},`,
`// DRINK (consumable)
sports_drink: {
  name:"Sports Drink",
  type:"consumable",
  weight:0.6,
  stack:4,
  tags:["drink"],
  size:[1,1],
  useText:"It tastes like chemicals and relief.",
  effects:{ thirst:+28, mood:+1 }
},`,
`// MEDICAL
splint: {
  name:"Splint",
  type:"medical",
  weight:0.7,
  stack:2,
  tags:["medical"],
  size:[2,1],
  useText:"You brace the limb as best you can.",
  effects:{ mood:+1 },
  specials:[/* optional custom logic later */]
},`,
`// MELEE WEAPON
hatchet: {
  name:"Hatchet",
  type:"weapon",
  weight:1.2,
  stack:1,
  tags:["melee"],
  size:[1,3],
  equip:{ slot:"weapon" },
  weapon:{ kind:"melee", dmg:[8,14], crit:0.10 }
},`,
`// FIREARM (needs ammo id)
revolver: {
  name:".38 Revolver",
  type:"weapon",
  weight:1.2,
  stack:1,
  tags:["firearm"],
  size:[2,2],
  equip:{ slot:"weapon" },
  weapon:{ kind:"firearm", dmg:[11,18], crit:0.10, ammo:"ammo_9mm" }
},`,
`// ARMOR (body/head/arms/legs/ankles)
kevlar_vest: {
  name:"Kevlar Vest",
  type:"armor",
  weight:2.6,
  stack:1,
  tags:["armor"],
  size:[2,2],
  equip:{ slot:"body" },
  clothing:{ armor:0.10, warmth:+1 }
},`,
`// BACKPACK (only one equipped in Back slot)
large_pack: {
  name:"Large Hiking Pack",
  type:"gear",
  weight:2.6,
  stack:1,
  tags:["backpack","gear"],
  size:[3,3],
  equip:{ slot:"back" },
  clothing:{ gridW:11, gridH:6, carry:+20, waterproof:+2 }
},`
    ].join("\n\n");
wrap.querySelector("#tplBox").textContent = templates;

    return;
  }

}

function useItem(itemId){
  const def = CONTENT.items.defs[itemId];
  if (!def) return;
  if (!hasItem(itemId,1)) return toast("You don't have that.");
  if (def.type !== "consumable" && def.type !== "medical"){
    toast("That isn't usable right now.");
    return;
  }
  removeItem(itemId,1);
  if (def.useText) addLog("system", escapeHtml(def.useText), { key:"USE" });
  if (def.effects) applyStatDelta(def.effects);
  if (def.specials) def.specials.forEach(resolveMedicalSpecial);

  // using takes a bit of time in the world
  advanceMinutes(4, "rest");
  refreshAll();
}

function equipWeapon(itemId){
  // Backward-compat wrapper
  equipItem(itemId);
}
function dropItem(itemId){
  if (!hasItem(itemId,1)) return;

  // If it is equipped in any slot, unequip first.
  for (const s of Object.keys(state.inv.gear || {})){
    if (state.inv.gear[s] === itemId) state.inv.gear[s] = null;
  }

  removeItem(itemId,1);
  addLog("system", "You drop it. The road swallows it.", { key:"DROP" }, true);
  refreshAll();
}

function refreshSkillTree(){
  const meta = document.getElementById("skillMeta");
  const grid = document.getElementById("skillGrid");
  meta.innerHTML = `
    <div class="chip"><span class="tag">LEVEL</span> <b>${state.stats.level}</b></div>
    <div class="chip"><span class="tag">XP</span> <b>${state.stats.xp}</b> / ${xpToNext(state.stats.level)}</div>
    <div class="chip"><span class="tag">SKILL POINTS</span> <b>${state.stats.skillPoints}</b></div>
  `;

  grid.innerHTML = "";
  const cols = CONTENT.skills.columns;
  const byCol = new Map(cols.map(c=>[c.id, []]));
  for (const n of CONTENT.skills.nodes){
    if (!byCol.has(n.col)) byCol.set(n.col, []);
    byCol.get(n.col).push(n);
  }

  const owned = new Set(state.skills.owned||[]);
  for (const c of cols){
    const col = document.createElement("div");
    col.className = "skillCol";
    col.innerHTML = `<h4>${escapeHtml(c.name)}</h4>`;
    const nodes = (byCol.get(c.id)||[]);
    for (const n of nodes){
      const div = document.createElement("div");
      const isOwned = owned.has(n.id);
      const chk = canBuySkill(n);
      const locked = !chk.ok && !isOwned;
      div.className = "node" + (isOwned?" owned":"") + (locked?" locked":"");
      const reqText = n.req && n.req.length ? `Requires: ${n.req.map(id=>CONTENT.skills.nodes.find(x=>x.id===id)?.name || id).join(", ")}` : "No prerequisites";
      div.innerHTML = `
        <div class="badge"></div>
        <div class="nm">${escapeHtml(n.name)} <span class="cost">${n.cost} SP</span></div>
        <div class="ds">${escapeHtml(n.desc)}</div>
        <div class="req">${escapeHtml(reqText)}${locked && !isOwned ? " • Locked" : ""}</div>
      `;
      div.addEventListener("click", ()=>{
        if (isOwned) return toast("Already learned.");
        const chk2 = canBuySkill(n);
        if (!chk2.ok) return toast(chk2.why);
        buySkill(n.id);
      });
      col.appendChild(div);
    }
    grid.appendChild(col);
  }
}

function refreshAll(){
  if (state && state.inv) repackInventory();
  refreshTop();
  refreshStats();
  refreshLog();
  refreshActions();
  refreshInventory();
  if (document.getElementById("skillModal").classList.contains("show")){
    refreshSkillTree();
  }
  if (document.getElementById("craftModal").classList.contains("show")){
    refreshCraftingModal();
  }
  // subtitle context line
  const sub = document.getElementById("subline");
  const ctx = state.context;
  if (ctx.mode==="travel"){
    const b = currentBiome();
    const miles = (state.world && typeof state.world.miles==="number") ? state.world.miles : state.distance;
    const amb = (state.world && state.world.lastAmbient) ? state.world.lastAmbient : "";
    sub.textContent = `${b.name} • ${miles.toFixed(1)} mi • ${amb || "Open road. The next step decides the story."}`;
  }
  else if (ctx.mode==="camp") sub.textContent = "Camp: conserve energy, manage injuries, craft, then move again.";
  else if (ctx.mode==="location"){
    const loc = currentLocation();
    sub.textContent = loc ? `${loc.name} • Search areas, track what’s looted, then leave.` : "Location";
  }else if (ctx.mode==="combat"){
    sub.textContent = "Combat: choose actions carefully. Injuries persist.";
  }else if (ctx.mode==="event"){
    sub.textContent = "Decision point: your choice changes your condition and your supplies.";
  }
}

// ---------- UI Hooks ----------
document.getElementById("btnSave").addEventListener("click", saveGame);
document.getElementById("btnLoad").addEventListener("click", ()=>{
  const ok = loadGame();
  if (ok){
    addLog("system","Save restored. The road resumes.", { key:"LOAD" });
    refreshAll();
  }
});
document.getElementById("btnNew").addEventListener("click", ()=>{
  if (confirm("Start a new run? This will overwrite current session (your saved file stays until you save again).")){
    newGame();
  }
});

document.getElementById("btnSkills").addEventListener("click", ()=>{
  document.getElementById("skillModal").classList.add("show");
  refreshSkillTree();
});
document.getElementById("btnCloseCraft").addEventListener("click", closeCraftingModal);
document.getElementById("btnCraftHelp").addEventListener("click", ()=>{
  addLog("system","Crafting: recipes consume materials and take time. Results must fit your inventory grid. If a recipe says No room, drop items or equip a bigger pack.", { key:"HELP" });
});

document.getElementById("btnCloseSkills").addEventListener("click", ()=>{
  document.getElementById("skillModal").classList.remove("show");
});
document.getElementById("btnSkillHelp").addEventListener("click", ()=>{
  addLog("system",
    "Skill Tree tips: You gain XP from travel, scavenging, and surviving fights. Each level grants 1 Skill Point. " +
    "Skills are permanent and stack. Expand the tree by adding nodes in CONTENT.skills.nodes.",
    { key:"HELP" }
  );
  refreshLog();
});

// Inventory tabs
document.querySelectorAll(".tabbtn").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    refreshInventory();
  });
});

// Close modal on backdrop click
document.getElementById("craftModal").addEventListener("click", (e)=>{
  if (e.target.id==="craftModal") closeCraftingModal();
});

document.getElementById("skillModal").addEventListener("click", (e)=>{
  if (e.target.id==="skillModal"){
    document.getElementById("skillModal").classList.remove("show");
  }
});

// Keyboard support
window.addEventListener("keydown", (e)=>{
  if (e.key==="Escape"){
    document.getElementById("skillModal").classList.remove("show");
  }
  if (e.key===" "){
    // space to travel if in travel mode
    if (state && state.context.mode==="travel"){
      e.preventDefault();
      travel();
    }
  }
});


// ---------- UI Consistency Fix ----------
// Some event choices replace the current event with a new event (or switch modes).
// Always refresh the UI after any action so option buttons update immediately.
const __doActionCore = doAction;
doAction = function(action, payload){
  try{
    return __doActionCore(action, payload || {});
  } finally {
    if (typeof refreshAll === "function") refreshAll();
  }
};


// ---------- Boot ----------
(function init(){
  initWorld(false);
  normalizeAllItems();
  // Load if exists, else start new
  if (!loadGame()){
    newGame();
  }else{
    // ensure at least one intro message if empty
    if (!state.log || state.log.length===0){
      addLog("system", "You shoulder your pack and face the horizon. The road does not end — it only changes.", { key:"RESUME" });
    }
    refreshAll();
  }
})();
</script>
