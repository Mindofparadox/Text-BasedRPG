<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Endless Road — Apocalyptic Text RPG</title>
  <style>
    :root{
      --bg:#07090b;
      --panel:#0d1116;
      --panel2:#0a0e12;
      --ink:#e6edf3;
      --muted:#9aa4af;
      --muted2:#7a8591;
      --accent:#62e6b5;
      --accent2:#f3b85a;
      --danger:#ff5c6a;
      --good:#62e6b5;
      --warn:#f3b85a;
      --line:#1b2530;
      --shadow: 0 14px 38px rgba(0,0,0,.55);
      --radius:14px;
      --radius2:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; overflow:hidden; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 800px at 75% 10%, rgba(98,230,181,.09), transparent 50%),
        radial-gradient(1000px 700px at 10% 30%, rgba(243,184,90,.06), transparent 55%),
        radial-gradient(900px 600px at 60% 80%, rgba(255,92,106,.07), transparent 55%),
        linear-gradient(180deg, #050608 0%, #07090b 35%, #050608 100%);
      color:var(--ink);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:14px 14px 14px;
      height:100vh;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    header{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding:14px 14px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(13,17,22,.92), rgba(10,14,18,.92));
      box-shadow:var(--shadow);
      border-radius:var(--radius2);
      position:relative;
      top:auto;
      z-index:5;
      backdrop-filter: blur(8px);
    }

    .title{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:0;
    }
    .sigil{
      width:42px; height:42px;
      border-radius:12px;
      background:
        radial-gradient(circle at 30% 25%, rgba(98,230,181,.25), transparent 55%),
        radial-gradient(circle at 65% 70%, rgba(243,184,90,.18), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0));
      border:1px solid rgba(255,255,255,.08);
      display:grid;
      place-items:center;
      box-shadow:0 10px 24px rgba(0,0,0,.5);
      flex:0 0 auto;
    }
    .sigil svg{ opacity:.92; }
    .title h1{
      margin:0;
      font-size:15px;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .subtitle{
      margin:4px 0 0;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.03em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .topmeta{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.25);
      color:var(--muted);
      font-size:12px;
      letter-spacing:.02em;
      user-select:none;
    }
    .pill b{ color:var(--ink); font-weight:650; }
    .pill .dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 3px rgba(98,230,181,.12);
    }
    .pill.warn .dot{ background:var(--warn); box-shadow:0 0 0 3px rgba(243,184,90,.12); }
    .pill.danger .dot{ background:var(--danger); box-shadow:0 0 0 3px rgba(255,92,106,.12); }

    .grid{
      margin-top:0;
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: 340px 1fr 340px;
      grid-template-rows: 1fr;
      gap:14px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(13,17,22,.92), rgba(10,14,18,.92));
      border-radius:var(--radius2);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .panel .hd{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panel .hd h2{
      margin:0;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted);
      font-weight:700;
    }
    .panel .bd{
      padding:12px 14px 14px;
      flex:1;
      min-height:0;
    }

    .stat{
      margin:10px 0 12px;
    }
    .stat .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:6px;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.02em;
    }
    .stat .row b{
      color:var(--ink);
      font-weight:650;
    }
    .bar{
      position:relative;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.06);
      overflow:hidden;
    }
    .bar > i{
      position:absolute; inset:0;
      width:50%;
      background:linear-gradient(90deg, rgba(98,230,181,.9), rgba(98,230,181,.2));
      border-radius:999px;
    }
    .bar.warn > i{
      background:linear-gradient(90deg, rgba(243,184,90,.92), rgba(243,184,90,.2));
    }
    .bar.danger > i{
      background:linear-gradient(90deg, rgba(255,92,106,.92), rgba(255,92,106,.2));
    }

    .minirow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:10px 0 4px;
    }
    .chip{
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.22);
      color:var(--muted);
      font-size:12px;
      letter-spacing:.02em;
      display:flex;
      gap:6px;
      align-items:center;
    }
    .chip b{ color:var(--ink); font-weight:650; }
    .chip .tag{
      font-family:var(--mono);
      font-size:11px;
      color:rgba(255,255,255,.65);
      padding:2px 6px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
    }

    .log{
      flex:1;
      min-height:0;
      overflow:auto;
      padding-right:6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    .log::-webkit-scrollbar{ width:10px; }
    .log::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:12px; border:3px solid transparent; background-clip:padding-box; }
    .entry{
      padding:10px 10px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.2);
      border-radius:14px;
      margin:10px 0;
    }
    
    .entry{
      position:relative;
    }
    .entry.new{
      border-color: rgba(98,230,181,.30);
      background: linear-gradient(180deg, rgba(98,230,181,.10), rgba(0,0,0,.20));
    }
    .entry.new::before{
      content:"";
      position:absolute;
      left:10px;
      top:12px;
      bottom:12px;
      width:3px;
      border-radius:999px;
      background: rgba(98,230,181,.65);
      box-shadow: 0 0 0 3px rgba(98,230,181,.10);
      opacity:.85;
    }
    .entry.new.pulse{
      animation: newPulse 1.15s ease-out 0s 2;
    }
    @keyframes newPulse{
      0% { transform: translateY(0); box-shadow: 0 0 0 rgba(0,0,0,0); }
      40% { transform: translateY(-1px); box-shadow: 0 16px 40px rgba(98,230,181,.10); }
      100% { transform: translateY(0); box-shadow: 0 0 0 rgba(0,0,0,0); }
    }
    .k.newtag{
      border-color: rgba(98,230,181,.28);
      background: rgba(98,230,181,.08);
      color: rgba(230,237,243,.92);
    }
.entry .t{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.03em;
      margin-bottom:6px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .entry .t .k{
      font-family:var(--mono);
      font-size:11px;
      color:rgba(255,255,255,.7);
      padding:2px 7px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
    }
    .entry .c{
      font-size:14px;
      line-height:1.45;
      color:rgba(230,237,243,.94);
    }
    .entry .c b{ color:var(--ink); }
    .entry .c em{ color:rgba(243,184,90,.95); font-style:normal; }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    button{
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color:var(--ink);
      padding:10px 12px;
      border-radius:14px;
      font-size:13px;
      letter-spacing:.02em;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      transition: transform .08s ease, border-color .15s ease, background .15s ease;
      user-select:none;
    }
    button:hover{ transform: translateY(-1px); border-color: rgba(98,230,181,.25); }
    button:active{ transform: translateY(0px) scale(.99); }
    button.primary{
      border-color: rgba(98,230,181,.34);
      background:linear-gradient(180deg, rgba(98,230,181,.20), rgba(98,230,181,.06));
    }
    button.danger{
      border-color: rgba(255,92,106,.38);
      background:linear-gradient(180deg, rgba(255,92,106,.18), rgba(255,92,106,.06));
    }
    button.ghost{
      box-shadow:none;
      background:rgba(0,0,0,.18);
      border-color: rgba(255,255,255,.08);
      color:var(--muted);
    }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none !important;
    }

    .invTabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    
    /* Codex (item reference) */
    .codexBar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:10px;
    }
    .codexBar input{
      flex:1 1 180px;
      min-width: 160px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      color:var(--ink);
      font-size:13px;
      outline:none;
    }
    .codexBar input::placeholder{ color: rgba(154,164,175,.75); }
    .codexList{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .codexItem{
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.20);
      border-radius:14px;
      padding:10px;
    }
    .codexItem .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .codexItem .id{
      font-family:var(--mono);
      font-size:11px;
      color:rgba(255,255,255,.72);
      padding:2px 7px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
    }
    .codexItem .desc{
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
      margin-top:6px;
    }
    .templateBox{
      margin-top:10px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.22);
      border-radius:14px;
      padding:10px;
      overflow:auto;
      max-height: 240px;
      font-family:var(--mono);
      font-size:11px;
      color:rgba(230,237,243,.90);
      white-space:pre;
    }
.tabbtn{
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      box-shadow:none;
    }
    .tabbtn.active{
      border-color: rgba(98,230,181,.34);
      background:linear-gradient(180deg, rgba(98,230,181,.18), rgba(98,230,181,.06));
      color:var(--ink);
    }

    .invList{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
      min-height:0;
      max-height:none;
      overflow:auto;
      padding-right:6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    .invList::-webkit-scrollbar{ width:10px; }
    .invList::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:12px; border:3px solid transparent; background-clip:padding-box; }

    
    /* Grid Inventory */
    .gridInvCard{
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.20);
      border-radius:14px;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .gridHdr{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.02em;
    }
    .gridHdr b{ color:var(--ink); font-weight:700; }
        .invGrid{
      --cols: 6;
      --rows: 4;
      display:grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
      gap:6px;
      padding:10px;
      border-radius:14px;
      border:1px dashed rgba(255,255,255,.12);
      background:
        radial-gradient(220px 160px at 20% 20%, rgba(98,230,181,.05), transparent 60%),
        rgba(0,0,0,.16);
      position:relative;
      overflow:hidden;
      width:100%;
      aspect-ratio: var(--cols) / var(--rows);
      min-width:0;
    }
    .invCell{
      border-radius:10px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.02);
      min-height:0;
    }
    .invTile{
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      padding:6px 8px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:2px;
      cursor:pointer;
      min-height:0;
      user-select:none;
      min-width:0;
      box-shadow:none;
      transition: transform .08s ease, border-color .15s ease, background .15s ease;
    }
    .invTile:hover{ transform: translateY(-1px); border-color: rgba(98,230,181,.22); }
    .invTile.sel{
      border-color: rgba(98,230,181,.38);
      background:linear-gradient(180deg, rgba(98,230,181,.12), rgba(98,230,181,.04));
      box-shadow: 0 14px 28px rgba(0,0,0,.35);
    }
    .invTile .nm{
      font-weight:750;
      font-size:12px;
      letter-spacing:.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:rgba(230,237,243,.94);
    }
    .invTile .sm{
      color:var(--muted);
      font-size:11px;
      font-family:var(--mono);
      letter-spacing:.02em;
    }
    .invTile.bad{
      border-color: rgba(255,92,106,.30);
      background: rgba(255,92,106,.05);
    }
.item{
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.20);
      border-radius:14px;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .item .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .item .nm{
      font-weight:700;
      letter-spacing:.02em;
      font-size:13px;
      line-height:1.2;
    }
    .item .meta{
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .item .meta .tag{
      font-family:var(--mono);
      font-size:11px;
      color:rgba(255,255,255,.72);
      padding:2px 6px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
    }
        .item.sel{ border-color: rgba(98,230,181,.28); background: linear-gradient(180deg, rgba(98,230,181,.06), rgba(0,0,0,.20)); }
.item .btns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .item .btns button{
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
      box-shadow:none;
    }

    .kv{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin:7px 0;
      color:var(--muted);
      font-size:12px;
    }
    .kv b{ color:var(--ink); font-weight:650; }

    .divider{
      height:1px;
      background:var(--line);
      margin:12px 0;
    }

    /* Fit-to-screen layout helpers (PC-first) */
    .panel.stats .bd{ overflow:auto; }
    .panel.center .bd{ display:flex; flex-direction:column; min-height:0; }
    .panel.center .log{ flex:1; min-height:0; height:auto; }
    .panel.inv .bd{ display:flex; flex-direction:column; min-height:0; }


    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      place-items:center;
      background:rgba(0,0,0,.64);
      z-index:50;
      padding:16px;
    }
    .modal.show{ display:grid; }
    .modal .card{
      width:min(980px, 100%);
      max-height:min(85vh, 720px);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(13,17,22,.95), rgba(10,14,18,.95));
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
    }
    .modal .card .topbar{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .modal .card .topbar h3{
      margin:0;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted);
      font-weight:700;
    }
    .modal .card .content{
      padding:12px 14px 14px;
      overflow:auto;
    }

    .skillMeta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:10px;
    }
    .skillMeta .chip{ background:rgba(0,0,0,.18); }

    
    /* Equipment (slot-based) */
    .equipGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:10px;
      align-items:stretch;
    }
    .slotCard{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.20);
      border-radius:14px;
      padding:10px;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, border-color .15s ease, background .15s ease;
      min-width:0;
    }
    .slotCard:hover{ transform: translateY(-1px); border-color: rgba(98,230,181,.22); }
    .slotCard.sel{
      border-color: rgba(98,230,181,.34);
      background:linear-gradient(180deg, rgba(98,230,181,.14), rgba(98,230,181,.04));
    }
    .slotCard .sl{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:rgba(255,255,255,.72);
      margin-bottom:6px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }
    .slotCard .eq{
      font-size:13px;
      font-weight:750;
      letter-spacing:.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .slotCard .sub{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .slotList{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .slotRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.18);
      border-radius:12px;
      padding:10px;
      min-width:0;
    }
    .slotRow .nm{
      font-weight:700;
      font-size:12px;
      letter-spacing:.02em;
      min-width:0;
    }
    .slotRow .nm .k{
      margin-left:8px;
    }
    .slotRow .meta{
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .slotRow .left{
      min-width:0;
    }
    .slotRow button{
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
      box-shadow:none;
      flex:0 0 auto;
    }

    @media (max-width: 760px){
      .equipGrid{ grid-template-columns: 1fr; }
    }

.skillGrid{
      display:grid;

// ---------- Seeded RNG (so saves are stable) ----------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStringToSeed(str){
  let h = 2166136261 >>> 0;
  for (let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function pct(v, min, max){ return (v - min) / (max - min); }
function chance(rng, p){ return rng() < p; }
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickWeighted(rng, entries){
  const total = entries.reduce((s,e)=>s+e.w,0);
  let r = rng()*total;
  for (const e of entries){
    r -= e.w;
    if (r <= 0) return e.v;
  }
  return entries[entries.length-1].v;
}
function uid(prefix="id"){

}

/* =========================================================
   ITEM SYSTEM NOTES (easy expansion)
   ---------------------------------------------------------
   Add new items in: CONTENT.items.defs

   Recommended fields:
   - name: "Readable Name"
   - type: "consumable" | "medical" | "weapon" | "ammo" | "material" | "clothing" | "armor" | "gear"
   - weight: number (per unit)
   - stack: max stack size (1 for unique gear/weapons)
   - tags: ["food","drink","armor","backpack","melee","firearm",...]
   - size: [w,h] inventory grid size (optional; defaults by type)
   - equip: { slot: "weapon"|"head"|"body"|"arms"|"legs"|"ankles"|"back" } (optional)
   - weapon: { kind:"melee"|"firearm"|"throwable", dmg:[min,max], crit:0.10, ammo:"ammo_id"(firearm only) }
   - clothing: { warmth:+, waterproof:+, travelBonus:+, armor:0.05, carry:+, gridW:10, gridH:6 }
     * Backpacks: use equip.slot="back" and set clothing.gridW/gridH (inventory slots) + optional clothing.carry.

   You DO NOT need to edit code anywhere else if you:
   - set size:[w,h] for special shapes
   - set equip.slot for equippables (especially backpacks/armor)
   Loot: add your item id to any CONTENT.lootTables.* list.
   ========================================================= */

function normalizeItemDef(id, def){
  def._id = id;
  def.name = def.name || id;
  def.type = def.type || "misc";
  def.weight = (typeof def.weight === "number") ? def.weight : 0.5;
  def.stack = (typeof def.stack === "number") ? def.stack : 1;
  def.tags = Array.isArray(def.tags) ? def.tags : [];

  // Equip slot defaults
  if (!def.equip) def.equip = {};
  if (!def.equip.slot){
    if (def.type === "weapon") def.equip.slot = "weapon";
    else if (def.type === "clothing" || def.type === "armor") def.equip.slot = "body";
    else if (def.type === "gear" && def.tags.includes("backpack")) def.equip.slot = "back";
  }

  // Ensure sub-objects exist
  if (def.weapon && !Array.isArray(def.weapon.dmg)) def.weapon.dmg = [2,5];
  if (!def.clothing) def.clothing = def.clothing || def.gear || null;

  return def;
}

function normalizeAllItems(){
  const defs = CONTENT.items.defs || {};
  for (const [id, def] of Object.entries(defs)){
    normalizeItemDef(id, def);
  }
}
